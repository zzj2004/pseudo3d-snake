<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>TapTap 素材生成</title>
<style>
  body { margin: 0; background: #fff; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const TITLE = '蛇行千层';
const SUB = '伪三维爬层贪吃蛇';
const STUDIO = '泠泠七弦上的工作室 出品';
const FRUITS = ['#f00', '#fd0', '#90f', '#0cc', '#0a0', '#f80', '#a0c', '#06c'];

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
}
function grid(x, y, w, h, cell, alpha) {
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1;
  for (let gx = x; gx <= x + w; gx += cell) { ctx.beginPath(); ctx.moveTo(gx, y); ctx.lineTo(gx, y + h); ctx.stroke(); }
  for (let gy = y; gy <= y + h; gy += cell) { ctx.beginPath(); ctx.moveTo(x, gy); ctx.lineTo(x + w, gy); ctx.stroke(); }
  ctx.globalAlpha = 1;
}
function fruit(x, y, s, color) {
  ctx.fillStyle = color;
  rr(x, y, s, s, s * 0.15);
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = Math.max(2, s * 0.08);
  rr(x + s * 0.08, y + s * 0.08, s * 0.84, s * 0.84, s * 0.12);
  ctx.stroke();
}
function snake(pts, w, color) {
  ctx.strokeStyle = color;
  ctx.lineWidth = w;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.stroke();
}
function head(x, y, r, ang) {
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  const ex = Math.cos(ang + 0.6) * r * 0.45, ey = Math.sin(ang + 0.6) * r * 0.45;
  ctx.beginPath(); ctx.arc(x + ex, y + ey, r * 0.18, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + Math.cos(ang - 0.6) * r * 0.45, y + Math.sin(ang - 0.6) * r * 0.45, r * 0.18, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#d00';
  ctx.lineWidth = Math.max(3, r * 0.16);
  ctx.beginPath();
  ctx.moveTo(x + Math.cos(ang) * r, y + Math.sin(ang) * r);
  ctx.lineTo(x + Math.cos(ang) * r * 1.7, y + Math.sin(ang) * r * 1.7);
  ctx.stroke();
}
function logoMark(x, y, s) {
  ctx.fillStyle = '#fff';
  rr(x, y, s, s, s * 0.18);
  ctx.fill();
  ctx.strokeStyle = '#000';
  ctx.lineWidth = s * 0.05;
  rr(x, y, s, s, s * 0.18);
  ctx.stroke();
  const u = s / 100;
  snake([[x + 20*u, y + 72*u], [x + 38*u, y + 45*u], [x + 62*u, y + 62*u], [x + 80*u, y + 32*u]], s * 0.16, '#000');
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(x + 80*u, y + 32*u, s * 0.11, 0, Math.PI * 2); ctx.fill();
  fruit(x + 18*u, y + 16*u, s * 0.16, '#f00');
}
function layers3(x, y, s) {
  ctx.globalAlpha = 0.35;
  rr(x + s * 0.09, y + s * 0.09, s, s, s * 0.04); ctx.fillStyle = '#cfd6c8'; ctx.fill();
  ctx.globalAlpha = 0.55;
  rr(x + s * 0.045, y + s * 0.045, s, s, s * 0.04); ctx.fillStyle = '#dfe4d8'; ctx.fill();
  ctx.globalAlpha = 1;
  rr(x, y, s, s, s * 0.04); ctx.fillStyle = '#f6f7f2'; ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = Math.max(2, s * 0.012);
  rr(x, y, s, s, s * 0.04); ctx.stroke();
  grid(x, y, s, s, s / 10, 0.08);
}

const kind = (location.hash || '#promo').slice(1);
const SPECS = {
  icon:    [512, 512],
  cover_h: [460, 215],
  cover_v: [600, 900],
  promo:   [1920, 1080],
  banner:  [1920, 620]
};
const [W, H] = SPECS[kind] || SPECS.promo;
cv.width = W; cv.height = H;

ctx.fillStyle = '#f6f7f2';
ctx.fillRect(0, 0, W, H);

if (kind === 'icon') {
  layers3(36, 36, 440);
  const pts = [[110, 380], [170, 240], [256, 320], [340, 200], [400, 300]];
  snake(pts, 52, '#000');
  head(400, 300, 34, 0.4);
  fruit(120, 120, 62, '#f00');
  fruit(380, 110, 52, '#fd0');
} else if (kind === 'cover_h') {
  layers3(12, 12, 190);
  const pts = [[30, 170], [90, 80], [160, 150], [230, 60]];
  snake(pts, 26, '#000');
  head(230, 60, 17, 0.35);
  fruit(300, 40, 26, '#f00');
  fruit(330, 150, 26, '#0cc');
  logoMark(268, 52, 96);
  ctx.fillStyle = '#000';
  ctx.font = 'bold 58px "Microsoft YaHei", sans-serif';
  ctx.fillText(TITLE, 236, 190);
  ctx.font = '16px "Microsoft YaHei", sans-serif';
  ctx.globalAlpha = 0.6;
  ctx.fillText(STUDIO, 300, 210);
  ctx.globalAlpha = 1;
} else if (kind === 'cover_v') {
  layers3(30, 240, 540);
  const pts = [[110, 700], [200, 480], [300, 620], [420, 430], [500, 560]];
  snake(pts, 44, '#000');
  head(500, 560, 30, 1.1);
  fruit(120, 340, 40, '#f00');
  fruit(430, 320, 40, '#fd0');
  fruit(490, 740, 40, '#0cc');
  logoMark(220, 40, 160);
  ctx.fillStyle = '#000';
  ctx.textAlign = 'center';
  ctx.font = 'bold 96px "Microsoft YaHei", sans-serif';
  ctx.fillText(TITLE, 300, 300);
  ctx.font = '26px "Microsoft YaHei", sans-serif';
  ctx.globalAlpha = 0.6;
  ctx.fillText(SUB, 300, 830);
  ctx.fillText(STUDIO, 300, 870);
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
} else if (kind === 'promo' || kind === 'banner') {
  const bs = kind === 'promo' ? 560 : 420;
  layers3(90, H - bs - 90, bs);
  const oy = H - bs - 90;
  const pts = [[130, oy + bs * 0.75], [260, oy + bs * 0.35], [400, oy + bs * 0.6], [540, oy + bs * 0.25], [bs + 60, oy + bs * 0.5]];
  snake(pts, bs * 0.09, '#000');
  head(bs + 60, oy + bs * 0.5, bs * 0.07, 0);
  fruit(160, oy + 60, bs * 0.09, '#f00');
  fruit(bs - 20, oy + bs * 0.8, bs * 0.09, '#90f');
  fruit(bs + 120, oy + bs * 0.15, bs * 0.09, '#fd0');
  ctx.fillStyle = '#000';
  const tx = kind === 'promo' ? 760 : 640;
  ctx.font = 'bold ' + (kind === 'promo' ? 150 : 110) + 'px "Microsoft YaHei", sans-serif';
  ctx.fillText(TITLE, tx, H / 2 - (kind === 'promo' ? 120 : 60));
  ctx.font = (kind === 'promo' ? 44 : 34) + 'px "Microsoft YaHei", sans-serif';
  ctx.globalAlpha = 0.75;
  ctx.fillText('撞上自己,爬上一层', tx + 6, H / 2 - (kind === 'promo' ? 40 : 10));
  ctx.globalAlpha = 1;
  ctx.font = (kind === 'promo' ? 34 : 28) + 'px "Microsoft YaHei", sans-serif';
  ctx.globalAlpha = 0.85;
  ctx.fillText('六种模式 · 20 种果子 · 21 项成就 · 隐藏皮肤', tx + 6, H / 2 + (kind === 'promo' ? 40 : 60));
  ctx.font = '24px "Microsoft YaHei", sans-serif';
  ctx.globalAlpha = 0.5;
  ctx.fillText(STUDIO, tx + 6, H - 60);
  ctx.globalAlpha = 1;
}
</script>
</body>
</html>
