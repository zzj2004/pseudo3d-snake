<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>贪吃蛇</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #eee;
  }
  canvas {
    background: #fff;
    border: 2px solid #000;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: #000;
  }
  .controls button {
    padding: 4px 14px;
    font-size: 14px;
    border: 1px solid #000;
    background: #fff;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="game" width="400" height="400"></canvas>
  <div class="controls">
    <button id="startBtn">开始</button>
    <button id="pauseBtn">暂停</button>
    <button id="restartBtn">重新开始</button>
    <button id="modeBtn">模式:无尽</button>
    <button id="soundBtn">音效:关</button>
    <label for="speed">速度:</label>
    <input type="range" id="speed" min="80" max="300" step="10" value="150">
    <span id="speedLabel">150ms</span>
  </div>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const GRID = 20;
const COLS = canvas.width / GRID;
const ROWS = canvas.height / GRID;

const speedInput = document.getElementById('speed');
const speedLabel = document.getElementById('speedLabel');
speedInput.addEventListener('input', () => {
  speedLabel.textContent = speedInput.value + 'ms';
});

const pauseBtn = document.getElementById('pauseBtn');
const startBtn = document.getElementById('startBtn');
const restartBtn = document.getElementById('restartBtn');
pauseBtn.addEventListener('click', () => {
  if (started && !cleared && !settled) togglePause();
});
startBtn.addEventListener('click', () => {
  if (!started || cleared || settled) {
    reset();
    started = true;
    if (soundOn) ensureAudio();
  }
});
restartBtn.addEventListener('click', () => {
  reset();
  started = true;
  if (soundOn) ensureAudio();
});
const soundBtn = document.getElementById('soundBtn');
soundBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  soundBtn.textContent = soundOn ? '音效:开' : '音效:关';
  save.sound = soundOn;
  persist();
  if (soundOn) {
    ensureAudio();
    playSound('eat', 'normal');
  }
});
function togglePause() {
  paused = !paused;
  pauseBtn.textContent = paused ? '继续' : '暂停';
  if (mode === 'timed') {
    if (paused) timedPauseLeft = timedEndsAt - Date.now();
    else timedEndsAt = Date.now() + timedPauseLeft;
  }
}

const modeBtn = document.getElementById('modeBtn');
const MODE_NAMES = {endless: '无尽', survival: '有命', timed: '限时'};
const MODE_DESC = {
  endless: '无尽模式:经典玩法,永不结束',
  survival: '有命模式:3 条命,小心炸弹果',
  timed: '限时模式:180 秒冲高分'
};
let mode = 'endless';
function applyModeBtn() {
  modeBtn.textContent = '模式:' + MODE_NAMES[mode];
}
applyModeBtn();
modeBtn.addEventListener('click', () => {
  if (started && !cleared && !settled) {
    showToast('本局结束后可切换模式');
    return;
  }
  const order = ['endless', 'survival', 'timed'];
  mode = order[(order.indexOf(mode) + 1) % 3];
  applyModeBtn();
  reset();
});

let started = false;
let paused = false;
let cleared = false;
let settled = false;
let settleReason = '';
let score = 0;
let lives = 3;
let invincibleUntil = 0;
let timedEndsAt = 0;
let timedPauseLeft = 0;
let bestAtStart = 0;
let fastUntil = 0;
let slowUntil = 0;
let doubleUntil = 0;
let ghostUntil = 0;
let reverseUntil = 0;
let layerChangeAt = 0;
let layerChangeDir = 0;
let toastMsg = null;
const hintsShown = {};

function showToast(text) {
  toastMsg = {text: text, at: Date.now()};
}
function showHint(key, text) {
  if (hintsShown[key]) return;
  hintsShown[key] = true;
  showToast(text);
}

const SAVE_KEY = 'snake3d_save';
const FRUIT_DESC = {
  normal: '普通 +1 分', fast: '加速 6 秒', slow: '减速 6 秒', grow: '蛇身 +3',
  shrink: '蛇身 -2', reverse: '方向反转 8 秒', up: '升上一层', down: '降下一层',
  rainbow: '随机一种效果', gold: '+50 分不变长', teleport: '传送到本层空格',
  clock: '重置速度效果', bomb: '炸弹 扣 1 命',
  double: '双倍分 10 秒', ghost: '隐身 5 秒穿身', scissors: '蛇身减半'
};
function defaultSave() {
  return {v: 2, best: {endless: 0, survival: 0, timed: 0}, sound: false, stats: {climbs: 0, descents: 0, fruits: {}}, book: {}};
}
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return defaultSave();
    const s = JSON.parse(raw);
    if (!s || !s.stats) return defaultSave();
    let best;
    if (s.v === 2 && s.best && typeof s.best === 'object') {
      best = {
        endless: Number(s.best.endless) || 0,
        survival: Number(s.best.survival) || 0,
        timed: Number(s.best.timed) || 0
      };
    } else if (s.v === 1) {
      best = {endless: Number(s.best) || 0, survival: 0, timed: 0};
    } else {
      return defaultSave();
    }
    return {
      v: 2,
      best: best,
      sound: !!s.sound,
      stats: {
        climbs: Number(s.stats.climbs) || 0,
        descents: Number(s.stats.descents) || 0,
        fruits: (s.stats.fruits && typeof s.stats.fruits === 'object') ? s.stats.fruits : {}
      },
      book: (s.book && typeof s.book === 'object') ? s.book : {}
    };
  } catch (e) {
    return defaultSave();
  }
}
function persist() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(save));
  } catch (e) {}
}
const save = loadSave();

let soundOn = save.sound;
soundBtn.textContent = soundOn ? '音效:开' : '音效:关';
let audioCtx = null;
const FRUIT_PITCH = {
  normal: 440, fast: 587, slow: 349, grow: 494,
  shrink: 330, reverse: 294, up: 659, down: 262,
  rainbow: 622, gold: 880, teleport: 220, clock: 392, bomb: 110,
  double: 988, ghost: 698, scissors: 175
};

let snake = [{x: 10, y: 10, z: 1}];
let dir = {x: 1, y: 0};
let nextDir = dir;

let demoSnake = [];
let demoDir = {x: 1, y: 0};
function resetDemo() {
  demoSnake = [];
  for (let i = 0; i < 7; i++) demoSnake.push({x: 8 - i, y: 5, z: 1});
  demoDir = {x: 1, y: 0};
}
function demoStep() {
  if (Math.random() < 0.35) {
    const opts = [{x: 0, y: -1}, {x: 0, y: 1}, {x: -1, y: 0}, {x: 1, y: 0}].filter(d => d.x !== -demoDir.x || d.y !== -demoDir.y);
    demoDir = opts[Math.floor(Math.random() * opts.length)];
  }
  const head = {x: demoSnake[0].x + demoDir.x, y: demoSnake[0].y + demoDir.y, z: 1};
  if (head.x < 0) head.x = COLS - 1;
  if (head.x >= COLS) head.x = 0;
  if (head.y < 0) head.y = ROWS - 1;
  if (head.y >= ROWS) head.y = 0;
  demoSnake = [head, ...demoSnake.slice(0, -1)];
}
resetDemo();

const FRUIT_STYLES = {
  normal:  '#f00',
  fast:    '#0a0',
  slow:    '#06c',
  grow:    '#c90',
  shrink:  '#a0c',
  reverse: '#f80',
  up:      '#f0f',
  down:    '#0cc',
  rainbow: '#ff0',
  gold:    '#fd0',
  teleport:'#666',
  clock:   '#fff',
  bomb:    '#a00',
  double:  '#ccc',
  ghost:   'rgba(120,120,120,0.5)',
  scissors:'#860'
};
const BASE_POOL = ['normal','normal','normal','normal','fast','slow','grow','shrink','reverse','rainbow','gold','teleport','clock','double','ghost','scissors'];
const RAINBOW_POOL = ['normal','fast','slow','grow','shrink','reverse','up','down'];

let layers = {};
function ensureLayer(z, avoid) {
  if (!layers[z]) {
    layers[z] = {fruits: [], walls: []};
    for (let i = 0; i < 3; i++) layers[z].fruits.push(randomFruit(z, avoid));
    if (z >= 2) {
      const count = 3 + Math.floor(Math.random() * 4) + Math.min(2, Math.floor((z - 1) / 5));
      for (let i = 0; i < count; i++) layers[z].walls.push(randomWall(z, avoid));
    }
  }
}
function fruitPool(z) {
  const pool = z >= 2 ? BASE_POOL.concat(['up', 'down']) : BASE_POOL.slice();
  if (mode === 'survival') pool.push('bomb');
  const bonus = Math.min(3, Math.floor((z - 1) / 3));
  for (let i = 0; i < bonus; i++) pool.push('gold', 'rainbow');
  return pool;
}
function randomFruit(z, avoid) {
  const pool = fruitPool(z);
  const fruits = layers[z].fruits;
  let p;
  do {
    p = {
      x: Math.floor(Math.random() * COLS),
      y: Math.floor(Math.random() * ROWS)
    };
  } while (snake.some(s => s.z === z && s.x === p.x && s.y === p.y) ||
           fruits.some(f => f.x === p.x && f.y === p.y) ||
           layers[z].walls.some(w => w.x === p.x && w.y === p.y) ||
           (avoid && avoid.x === p.x && avoid.y === p.y));
  p.type = pool[Math.floor(Math.random() * pool.length)];
  return p;
}
function randomWall(z, avoid) {
  let p;
  do {
    p = {
      x: Math.floor(Math.random() * COLS),
      y: Math.floor(Math.random() * ROWS)
    };
  } while (layers[z].walls.some(w => w.x === p.x && w.y === p.y) ||
           layers[z].fruits.some(f => f.x === p.x && f.y === p.y) ||
           snake.some(s => s.z === z && s.x === p.x && s.y === p.y) ||
           (avoid && avoid.x === p.x && avoid.y === p.y));
  return p;
}
ensureLayer(1);

function climbIfColliding(head, body) {
  for (let i = 0; i < 10 && body.some(s => s.z === head.z && s.x === head.x && s.y === head.y); i++) {
    head.z += 1;
    ensureLayer(head.z, head);
  }
}

function step() {
  if (!started || paused || cleared || settled) return;
  if (mode === 'timed' && Date.now() >= timedEndsAt) {
    settle('timeup');
    return;
  }
  dir = nextDir;

  const old = snake.map(s => ({x: s.x, y: s.y, z: s.z}));
  const head = {x: old[0].x + dir.x, y: old[0].y + dir.y, z: old[0].z};
  let wrapped = false;
  if (head.x < 0) { head.x = COLS - 1; wrapped = true; }
  if (head.x >= COLS) { head.x = 0; wrapped = true; }
  if (head.y < 0) { head.y = ROWS - 1; wrapped = true; }
  if (head.y >= ROWS) { head.y = 0; wrapped = true; }
  if (wrapped) showHint('wrap', '穿墙:从对侧出来,不会死');

  const eatsHere = layers[head.z].fruits.some(f => f.x === head.x && f.y === head.y);
  const body = eatsHere ? old : old.slice(0, -1);
  const ghosting = Date.now() < ghostUntil;
  const hitWall = layers[head.z].walls.some(w => w.x === head.x && w.y === head.y);
  if (hitWall) {
    head.z += 1;
    ensureLayer(head.z, head);
  }
  if (!ghosting) climbIfColliding(head, body);
  if (head.z > old[0].z) {
    showHint(hitWall ? 'wall' : 'climb', hitWall ? '撞到墙→爬上一层!' : '撞到自己→爬上一层!');
  }

  const eaten = layers[head.z].fruits.find(f => f.x === head.x && f.y === head.y);
  if (eaten) {
    const eatenZ = head.z;
    const eff = eaten.type === 'rainbow' ? RAINBOW_POOL[Math.floor(Math.random() * RAINBOW_POOL.length)] : eaten.type;
    if (eff === 'up') {
      head.z += 1;
      ensureLayer(head.z, head);
      climbIfColliding(head, old);
    } else if (eff === 'down' && head.z > 1) {
      head.z -= 1;
      climbIfColliding(head, old);
    }
    snake = [head, ...old];
    eat(eaten, eatenZ, eff);
  } else {
    snake = [head, ...old.slice(0, -1)];
  }

  if (snake[0].z !== old[0].z) {
    layerChangeAt = Date.now();
    layerChangeDir = snake[0].z > old[0].z ? 1 : -1;
    playSound(layerChangeDir > 0 ? 'climb' : 'descend');
    if (layerChangeDir > 0) save.stats.climbs++; else save.stats.descents++;
    persist();
  }
}

function eat(f, z, eff) {
  if (eff === undefined) eff = f.type;
  const mult = Date.now() < doubleUntil ? 2 : 1;
  let gain = mult;
  if (f.type === 'gold') gain += 50 * mult;
  const prevScore = score;
  score += gain;
  if (f.type === 'gold') showToast('+' + gain + ' 分!');
  if (Math.floor(score / 100) > Math.floor(prevScore / 100)) showToast(score + ' 分!');
  if (score >= 999999999 && mode === 'endless') {
    cleared = true;
    playSound('clear');
  }
  save.stats.fruits[f.type] = (save.stats.fruits[f.type] || 0) + 1;
  save.book[f.type] = true;
  if (score > save.best[mode]) save.best[mode] = score;
  persist();
  layers[z].fruits = layers[z].fruits.filter(x => x !== f);
  layers[z].fruits.push(randomFruit(z));

  const grow = {normal: 0, fast: 0, slow: 0, grow: 2, shrink: -3, reverse: 0, up: 0, down: 0, rainbow: 0, gold: 0, teleport: 0, clock: 0, bomb: 0, double: 0, ghost: 0, scissors: 0}[eff];
  if (grow > 0) {
    const tail = snake[snake.length - 1];
    for (let i = 0; i < grow; i++) snake.push({x: tail.x, y: tail.y, z: tail.z});
  } else {
    for (let i = 0; i < -grow && snake.length > 2; i++) snake.pop();
  }
  if (f.type === 'scissors') {
    const target = Math.max(2, Math.floor(snake.length / 2));
    while (snake.length > target) snake.pop();
    showHint('scissors', '蛇身减半!');
  }

  if (f.type === 'double') { doubleUntil = Date.now() + 10000; showHint('double', '双倍分 10 秒!'); }
  if (f.type === 'ghost') { ghostUntil = Date.now() + 5000; showHint('ghost', '隐身 5 秒,穿身不爬层!'); }
  if (eff === 'fast') { fastUntil = Date.now() + 6000; slowUntil = 0; showHint('fast', '加速 6 秒!'); }
  if (eff === 'slow') { slowUntil = Date.now() + 6000; fastUntil = 0; showHint('slow', '减速 6 秒!'); }
  if (eff === 'clock') { fastUntil = 0; slowUntil = 0; showHint('clock', '速度效果已重置!'); }
  if (eff === 'grow') showHint('grow', '蛇身 +3');
  if (eff === 'shrink') showHint('shrink', '蛇身 -2');
  if (eff === 'reverse') { reverseUntil = Date.now() + 8000; showHint('reverse', '方向反转 8 秒!'); }
  if (f.type === 'teleport') {
    const z2 = snake[0].z;
    let p;
    do {
      p = {x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS)};
    } while (
      snake.some(s => s.z === z2 && s.x === p.x && s.y === p.y) ||
      layers[z2].fruits.some(q => q.x === p.x && q.y === p.y) ||
      layers[z2].walls.some(w => w.x === p.x && w.y === p.y)
    );
    snake[0].x = p.x;
    snake[0].y = p.y;
    showToast('传送!');
    playSound('teleport');
  } else if (f.type === 'bomb') {
    if (Date.now() < invincibleUntil) {
      showToast('无敌中,炸弹无效!');
    } else {
      lives--;
      if (lives <= 0) {
        settle('dead');
      } else {
        invincibleUntil = Date.now() + 2000;
        showToast('扣 1 命!剩 ' + lives + ' 命');
      }
    }
    playSound('bomb');
  } else if (f.type === 'reverse') playSound('reverse');
  else if (f.type !== 'up' && f.type !== 'down') playSound('eat', f.type);
}

function settle(reason) {
  settled = true;
  settleReason = reason;
  playSound('settle');
  persist();
}

function controlsReversed() {
  return Date.now() < reverseUntil;
}

function fillFruitShape(type, px, py, size) {
  if (type === 'rainbow') {
    const g = ctx.createLinearGradient(px, py, px + size, py + size);
    const t = Date.now() / 300;
    for (let i = 0; i <= 5; i++) {
      g.addColorStop(i / 5, 'hsl(' + Math.floor((t * 60 + i * 60) % 360) + ',85%,55%)');
    }
    ctx.fillStyle = g;
  } else {
    ctx.fillStyle = FRUIT_STYLES[type];
  }
  ctx.fillRect(px, py, size, size);
  if (type === 'bomb') {
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.strokeRect(px + 1, py + 1, size - 2, size - 2);
  } else if (type === 'double') {
    ctx.strokeStyle = 'rgba(246,190,0,' + (0.4 + 0.6 * Math.abs(Math.sin(Date.now() / 200))).toFixed(3) + ')';
    ctx.lineWidth = 2;
    ctx.strokeRect(px + 1, py + 1, size - 2, size - 2);
  } else if (type === 'rainbow' || type === 'clock' || type === 'ghost') {
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.strokeRect(px + 0.5, py + 0.5, size - 1, size - 1);
  }
}

function drawWall(x, y) {
  const px = x * GRID;
  const py = y * GRID;
  ctx.fillStyle = '#fff';
  ctx.fillRect(px, py, GRID, GRID);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  ctx.strokeRect(px + 3, py + 3, GRID - 6, GRID - 6);
  ctx.strokeStyle = '#bbb';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(px + 5, py + GRID - 5);
  ctx.lineTo(px + GRID - 5, py + 5);
  ctx.moveTo(px + 5, py + 5);
  ctx.lineTo(px + GRID - 5, py + GRID - 5);
  ctx.stroke();
}

function ensureAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  if (!audioCtx) audioCtx = new AC();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freq, delay, dur, type, vol, slideTo) {
  const t0 = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  gain.gain.setValueAtTime(vol, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + dur + 0.05);
}
function playSound(name, type) {
  if (!soundOn || !audioCtx) return;
  if (name === 'eat') {
    tone(FRUIT_PITCH[type] || 440, 0, 0.09, 'triangle', 0.12);
  } else if (name === 'climb') {
    tone(330, 0, 0.15, 'sine', 0.12, 660);
  } else if (name === 'descend') {
    tone(660, 0, 0.15, 'sine', 0.12, 330);
  } else if (name === 'reverse') {
    tone(420, 0, 0.09, 'square', 0.07);
    tone(310, 0.11, 0.13, 'square', 0.07);
  } else if (name === 'teleport') {
    tone(180, 0, 0.2, 'sine', 0.12, 720);
  } else if (name === 'bomb') {
    tone(150, 0, 0.22, 'square', 0.1, 55);
  } else if (name === 'settle') {
    tone(659, 0, 0.16, 'triangle', 0.12);
    tone(523, 0.15, 0.16, 'triangle', 0.12);
    tone(392, 0.3, 0.3, 'triangle', 0.12);
  } else if (name === 'clear') {
    tone(523, 0, 0.14, 'triangle', 0.12);
    tone(659, 0.13, 0.14, 'triangle', 0.12);
    tone(784, 0.26, 0.14, 'triangle', 0.12);
    tone(1047, 0.39, 0.32, 'triangle', 0.12);
  }
}

function draw() {
  const z = snake[0].z;
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.globalAlpha = 0.15;
  for (const dz of [z - 1, z + 1]) {
    if (!layers[dz]) continue;
    for (const f of layers[dz].fruits) {
      fillFruitShape(f.type, f.x * GRID, f.y * GRID, GRID);
    }
  }
  ctx.globalAlpha = 1;

  for (const w of layers[z].walls) {
    drawWall(w.x, w.y);
  }

  const INSET = 3;
  const RADIUS = 5;
  const onLayer = snake.filter(s => s.z === z);

  const blink = Date.now() < invincibleUntil && Math.floor(Date.now() / 120) % 2 === 0;
  const ghosting = Date.now() < ghostUntil;
  ctx.globalAlpha = blink ? 0.25 : (ghosting ? 0.45 : 1);
  ctx.fillStyle = '#000';
  for (let i = 0; i + 1 < onLayer.length; i++) {
    const a = onLayer[i], b = onLayer[i + 1];
    if (Math.abs(a.x - b.x) + Math.abs(a.y - b.y) !== 1) continue;
    if (a.x === b.x) {
      const y = Math.min(a.y, b.y);
      ctx.fillRect(a.x * GRID + INSET, y * GRID + GRID / 2, GRID - INSET * 2, GRID);
    } else {
      const x = Math.min(a.x, b.x);
      ctx.fillRect(x * GRID + GRID / 2, a.y * GRID + INSET, GRID, GRID - INSET * 2);
    }
  }
  for (const s of onLayer) {
    ctx.beginPath();
    if (ctx.roundRect) {
      ctx.roundRect(s.x * GRID + INSET, s.y * GRID + INSET, GRID - INSET * 2, GRID - INSET * 2, RADIUS);
    } else {
      ctx.rect(s.x * GRID + INSET, s.y * GRID + INSET, GRID - INSET * 2, GRID - INSET * 2);
    }
    ctx.fill();
  }

  const h = snake[0];
  const cx = h.x * GRID + GRID / 2;
  const cy = h.y * GRID + GRID / 2;
  const fx = cx + dir.x * 7;
  const fy = cy + dir.y * 7;
  const px = -dir.y * 4;
  const py = dir.x * 4;
  ctx.globalAlpha = blink ? 0.25 : (ghosting ? 0.45 : 1);
  ctx.fillStyle = '#fff';
  ctx.fillRect(fx + px - 2, fy + py - 2, 4, 4);
  ctx.fillRect(fx - px - 2, fy - py - 2, 4, 4);
  ctx.fillStyle = '#000';
  ctx.fillRect(fx + px - 1, fy + py - 1, 2, 2);
  ctx.fillRect(fx - px - 1, fy - py - 1, 2, 2);
  ctx.globalAlpha = 1;

  for (const f of layers[z].fruits) {
    fillFruitShape(f.type, f.x * GRID, f.y * GRID, GRID);
  }

  ctx.fillStyle = '#000';
  ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('得分: ' + score + '  第' + z + '层', 10, 20);

  if (mode === 'timed' && started && !settled) {
    const left = Math.max(0, timedEndsAt - Date.now());
    const mm = Math.floor(left / 60000);
    const ss = Math.floor(left % 60000 / 1000);
    ctx.fillStyle = left <= 10000 ? '#d00' : '#000';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('剩余 ' + mm + ':' + (ss < 10 ? '0' : '') + ss, canvas.width / 2, 20);
  }
  if (mode === 'survival' && started && !settled) {
    ctx.fillStyle = Date.now() < invincibleUntil ? '#a00' : '#000';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('命 ×' + lives, canvas.width / 2, 20);
  }
  ctx.textAlign = 'left';

  const now = Date.now();
  let buffY = 40;
  if (now < fastUntil) {
    ctx.fillStyle = '#0a0';
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText('加速 ' + Math.ceil((fastUntil - now) / 1000) + 's', 10, buffY);
    buffY += 18;
  } else if (now < slowUntil) {
    ctx.fillStyle = '#06c';
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText('减速 ' + Math.ceil((slowUntil - now) / 1000) + 's', 10, buffY);
    buffY += 18;
  }
  if (now < doubleUntil) {
    ctx.fillStyle = '#b80';
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText('双倍分 ' + Math.ceil((doubleUntil - now) / 1000) + 's', 10, buffY);
    buffY += 18;
  }
  if (now < ghostUntil) {
    ctx.fillStyle = '#888';
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText('隐身 ' + Math.ceil((ghostUntil - now) / 1000) + 's', 10, buffY);
  }

  if (controlsReversed()) {
    ctx.fillStyle = '#f80';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'right';
    const secs = Math.ceil((reverseUntil - Date.now()) / 1000);
    ctx.fillText('方向反转 ' + secs + 's', canvas.width - 10, 20);
    ctx.textAlign = 'left';
  }

  const t = Date.now() - layerChangeAt;
  if (started && !paused && !cleared && t < 500) {
    const k = 1 - t / 500;
    ctx.fillStyle = 'rgba(255,255,255,' + (0.45 * k).toFixed(3) + ')';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = 'rgba(0,0,0,' + k.toFixed(3) + ')';
    ctx.font = 'bold 26px sans-serif';
    ctx.textAlign = 'center';
    const bounce = Math.round(-18 * Math.sin((1 - k) * Math.PI));
    ctx.fillText((layerChangeDir > 0 ? '↑ 进入第 ' : '↓ 回到第 ') + z + ' 层', canvas.width / 2, canvas.height / 2 + bounce);
  }

  if (toastMsg) {
    const age = Date.now() - toastMsg.at;
    if (age < 1000) {
      const k = Math.min(1, age / 150, (1000 - age) / 250);
      ctx.globalAlpha = k;
      ctx.fillStyle = '#000';
      ctx.font = 'bold 15px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(toastMsg.text, canvas.width / 2, 44);
      ctx.globalAlpha = 1;
      ctx.textAlign = 'left';
    }
  }

  if (settled) {
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#000';
    ctx.font = 'bold 28px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(settleReason === 'dead' ? '命用完了!' : '时间到!', canvas.width / 2, canvas.height / 2 - 40);
    ctx.font = '16px sans-serif';
    ctx.fillText(MODE_NAMES[mode] + '模式  得分: ' + score, canvas.width / 2, canvas.height / 2 - 8);
    ctx.fillText(score > bestAtStart ? '新纪录!' : '最高分: ' + save.best[mode], canvas.width / 2, canvas.height / 2 + 18);
    ctx.fillText('点击开始按钮再来一局', canvas.width / 2, canvas.height / 2 + 46);
  } else if (cleared) {
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#000';
    ctx.font = 'bold 28px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('通关!', canvas.width / 2, canvas.height / 2 - 20);
    ctx.font = '16px sans-serif';
    ctx.fillText('得分: ' + score, canvas.width / 2, canvas.height / 2 + 10);
    ctx.fillText('最高分: ' + save.best.endless, canvas.width / 2, canvas.height / 2 + 32);
    ctx.fillText('点击开始按钮再来一局', canvas.width / 2, canvas.height / 2 + 54);
  } else if (!started) {
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.globalAlpha = 0.3;
    ctx.fillStyle = '#000';
    for (const s of demoSnake) {
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(s.x * GRID + INSET, s.y * GRID + INSET, GRID - INSET * 2, GRID - INSET * 2, RADIUS);
      } else {
        ctx.rect(s.x * GRID + INSET, s.y * GRID + INSET, GRID - INSET * 2, GRID - INSET * 2);
      }
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000';
    ctx.font = 'bold 24px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('贪吃蛇', canvas.width / 2, canvas.height / 2 - 34);
    ctx.font = '16px sans-serif';
    ctx.fillText(MODE_DESC[mode], canvas.width / 2, canvas.height / 2 - 4);
    ctx.fillText('最高分: ' + save.best[mode], canvas.width / 2, canvas.height / 2 + 20);
    ctx.fillText('点击开始按钮开始游戏', canvas.width / 2, canvas.height / 2 + 44);
  } else if (paused) {
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#000';
    ctx.font = 'bold 22px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('暂停中', canvas.width / 2, 46);
    ctx.font = '13px sans-serif';
    ctx.fillText('按空格或点击暂停按钮继续', canvas.width / 2, 68);
    ctx.fillText(MODE_NAMES[mode] + '模式最高分: ' + save.best[mode] + '   爬层: 升 ' + save.stats.climbs + ' / 降 ' + save.stats.descents, canvas.width / 2, 92);
    ctx.font = 'bold 15px sans-serif';
    ctx.fillText('果子图鉴(吃过点亮)', canvas.width / 2, 120);
    ctx.font = '13px sans-serif';
    const types = Object.keys(FRUIT_STYLES);
    const perCol = Math.ceil(types.length / 2);
    for (let i = 0; i < types.length; i++) {
      const t = types[i];
      const x = 32 + Math.floor(i / perCol) * 186;
      const y = 144 + (i % perCol) * 26;
      ctx.globalAlpha = save.book[t] ? 1 : 0.35;
      fillFruitShape(t, x, y - 11, 14);
      ctx.globalAlpha = 1;
      ctx.fillStyle = save.book[t] ? '#000' : '#999';
      const count = save.stats.fruits[t] || 0;
      ctx.textAlign = 'left';
      ctx.fillText(save.book[t] ? FRUIT_DESC[t] + ' ×' + count : '未尝出…', x + 22, y);
    }
    ctx.textAlign = 'left';
  }
}

function reset() {
  snake = [{x: 10, y: 10, z: 1}];
  dir = {x: 1, y: 0};
  nextDir = dir;
  score = 0;
  lives = 3;
  invincibleUntil = 0;
  settled = false;
  settleReason = '';
  bestAtStart = save.best[mode] || 0;
  timedEndsAt = mode === 'timed' ? Date.now() + 180000 : 0;
  timedPauseLeft = 0;
  fastUntil = 0;
  slowUntil = 0;
  doubleUntil = 0;
  ghostUntil = 0;
  reverseUntil = 0;
  layers = {};
  ensureLayer(1);
  paused = false;
  cleared = false;
  pauseBtn.textContent = '暂停';
}

document.addEventListener('keydown', e => {
  if (e.isComposing) return;

  if (e.code === 'Space') {
    e.preventDefault();
    if (started && !cleared && !settled) togglePause();
    return;
  }

  if (!started || cleared || settled) return;

  const keyMap = {
    ArrowUp:    {x: 0, y: -1},
    ArrowDown:  {x: 0, y: 1},
    ArrowLeft:  {x: -1, y: 0},
    ArrowRight: {x: 1, y: 0}
  };
  let d = keyMap[e.code];
  if (!d) return;
  e.preventDefault();
  if (controlsReversed()) d = {x: -d.x, y: -d.y};
  if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d;
});

function tick() {
  if (!started) demoStep();
  step();
  let speed = Number(speedInput.value) - Math.min(100, score * 5);
  if (Date.now() < fastUntil) speed -= 60;
  if (Date.now() < slowUntil) speed += 60;
  speed = Math.max(50, Math.min(600, speed));
  setTimeout(tick, speed);
}
tick();

function frame() {
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
