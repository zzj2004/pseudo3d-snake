  #dpad .dp[data-dir="left"] { grid-column: 1; grid-row: 2; }

function calcSize() {
  const nw = window.innerWidth < 700;
  const cap = document.fullscreenElement ? 800 : 640;
  return nw
    ? Math.max(200, Math.floor((window.innerWidth - 12) / COLS) * COLS)
    : Math.max(400, Math.min(cap, Math.floor(Math.min(window.innerWidth * 0.55, window.innerHeight * 0.68) / COLS) * COLS));
}
let SIZE = calcSize();
canvas.width = SIZE;
canvas.height = SIZE;
let GRID = SIZE / COLS;
let PX = SIZE / 400;
window.addEventListener('resize', () => {
  const ns = calcSize();
  if (ns === SIZE) return;
  SIZE = ns;
  canvas.width = SIZE;
  canvas.height = SIZE;
  GRID = SIZE / COLS;
  PX = SIZE / 400;
});
const shadowCv = document.getElementById('shadowCv');
const sctx = shadowCv.getContext('2d');

function mulberry32(a) {
  return function() {
    a |= 0;
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function dailySeed() {
  const d = new Date();
  return (d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate()) | 0;
}
function isHoliday() {
  const d = new Date();
  const md = (d.getMonth() + 1) * 100 + d.getDate();
  return md === 101 || md === 111 || md === 501 || (md >= 1001 && md <= 1007);
}
function applyModeBtn() {

function defaultSave() {
  return {v: 2, best: {endless: 0, survival: 0, timed: 0, daily: 0, fog: 0, zen: 0}, sound: false, bgm: false, stats: {climbs: 0, descents: 0, fruits: {}, gates: 0, goldLives: 0, maxCombo: 0}, book: {}, skins: {bamboo: false, cyber: false}, skin: 'classic', ach: {}};
}
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return defaultSave();
    const s = JSON.parse(raw);
    if (!s || !s.stats) return defaultSave();
    let best;
    if (s.v === 2 && s.best && typeof s.best === 'object') {
      best = {
        endless: Number(s.best.endless) || 0,
        survival: Number(s.best.survival) || 0,
        timed: Number(s.best.timed) || 0,
        daily: Number(s.best.daily) || 0,
        fog: Number(s.best.fog) || 0,
        zen: Number(s.best.zen) || 0
      };
    } else if (s.v === 1) {
      best = {endless: Number(s.best) || 0, survival: 0, timed: 0, daily: 0, fog: 0, zen: 0};
    } else {
      return defaultSave();
    }
    return {
      v: 2,
      best: best,
      sound: !!s.sound,
      stats: {
        climbs: Number(s.stats.climbs) || 0,
        descents: Number(s.stats.descents) || 0,
        gates: Number(s.stats.gates) || 0,
        goldLives: Number(s.stats.goldLives) || 0,
        maxCombo: Number(s.stats.maxCombo) || 0,
        fruits: (s.stats.fruits && typeof s.stats.fruits === 'object') ? s.stats.fruits : {}
      },
      book: (s.book && typeof s.book === 'object') ? s.book : {},
      bgm: !!s.bgm,
      ach: (s.ach && typeof s.ach === 'object') ? s.ach : {},
      skins: {
        bamboo: !!(s.skins && s.skins.bamboo),
        cyber: !!(s.skins && s.skins.cyber)
      },
      skin: (typeof s.skin === 'string' && SKINS[s.skin]) ? s.skin : 'classic'
    };
  } catch (e) {
    return defaultSave();
  }
}
function persist() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(save));
  } catch (e) {}
}

let bgmStep = 0;
const BGM_SEQ = [262, 330, 392, 523, 392, 330, 294, 330, 392, 440, 523, 587, 523, 440, 392, 330];
function bgmNote() {
  if (!bgmOn || !audioCtx) return;
  const f = BGM_SEQ[bgmStep % BGM_SEQ.length];
  tone(f, 0, 0.22, 'triangle', 0.03);
  if (bgmStep % 4 === 0) tone(f / 2, 0, 0.3, 'sine', 0.025);
  bgmStep++;
}
function bgmStart() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  if (!audioCtx) audioCtx = new AC();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (!bgmTimer) bgmTimer = setInterval(bgmNote, 280);
}
function bgmStop() {
  if (bgmTimer) {
    clearInterval(bgmTimer);
    bgmTimer = null;
  }
}
bgmBtn.addEventListener('click', () => {
  bgmOn = !bgmOn;
  bgmBtn.textContent = bgmOn ? '音乐:开' : '音乐:关';
  save.bgm = bgmOn;
  persist();
  if (bgmOn) bgmStart(); else bgmStop();
});

const FRUIT_STYLES = {

const BASE_POOL = ['normal','normal','normal','normal','fast','slow','grow','shrink','reverse','rainbow','gold','teleport','clock','double','ghost','scissors','shield','magnet','freeze','harvest'];
const RAINBOW_POOL = ['normal','fast','slow','grow','shrink','reverse','up','down'];

let layers = {};
function ensureLayer(z, avoid) {
  if (!layers[z]) {
    layers[z] = {fruits: [], walls: [], traps: [], gate: (z > 0 && z % 10 === 0) ? {needed: 3, eaten: 0, open: false} : null};
    for (let i = 0; i < 3; i++) layers[z].fruits.push(randomFruit(z, avoid, true));
    if (z >= 2) {
      const count = 4 + Math.floor(rand() * 4) + Math.min(4, Math.floor((z - 1) / 2));
      for (let i = 0; i < count; i++) layers[z].walls.push(randomWall(z, avoid));
      if (mode !== 'zen') {
        const tcount = 1 + Math.min(2, Math.floor((z - 1) / 3));
        for (let i = 0; i < tcount; i++) layers[z].traps.push(randomWall(z, avoid));
      }
    }
  }
}
function fruitPool(z) {
  const pool = z >= 2 ? BASE_POOL.concat(['up', 'down']) : BASE_POOL.slice();
  if (z >= 2 && mode !== 'zen') {
    pool.push('bomb', 'bomb');
    if (z >= 5) pool.push('bomb');
    if (z >= 9) pool.push('bomb');
    if (mode === 'survival' && z >= 5) pool.push('bomb');
  }
  if (isHoliday()) pool.push('gold', 'gold');
  const bonus = Math.min(3, Math.floor((z - 1) / 3));
  for (let i = 0; i < bonus; i++) pool.push('gold', 'rainbow');
  return pool;
}
function randomFruit(z, avoid, noDanger) {
  const pool = fruitPool(z).filter(t => !noDanger || (t !== 'up' && t !== 'bomb'));
  const fruits = layers[z].fruits;
  let p;
  do {
    p = {
      x: Math.floor(rand() * COLS),
      y: Math.floor(rand() * ROWS)
    };
  } while (snake.some(s => s.z === z && s.x === p.x && s.y === p.y) ||
           fruits.some(f => f.x === p.x && f.y === p.y) ||
           layers[z].walls.some(w => w.x === p.x && w.y === p.y) ||
           layers[z].traps.some(t => t.x === p.x && t.y === p.y) ||
           (avoid && avoid.x === p.x && avoid.y === p.y));
  p.type = pool[Math.floor(rand() * pool.length)];
  return p;
}
function randomWall(z, avoid) {
  let p;
  do {
    p = {
      x: Math.floor(rand() * COLS),
      y: Math.floor(rand() * ROWS)
    };
  } while (layers[z].walls.some(w => w.x === p.x && w.y === p.y) ||
           layers[z].traps.some(t => t.x === p.x && t.y === p.y) ||
           layers[z].fruits.some(f => f.x === p.x && f.y === p.y) ||
           snake.some(s => s.z === z && s.x === p.x && s.y === p.y) ||
           (avoid && avoid.x === p.x && avoid.y === p.y));
  return p;
}
ensureLayer(1);

function climbIfColliding(head, body) {
  for (let i = 0; i < 10 && body.some(s => s.z === head.z && s.x === head.x && s.y === head.y); i++) {
    head.z += 1;

}

function step() {
  if (!started || paused || cleared || settled) return;
  if (mode === 'timed' && Date.now() >= timedEndsAt) {
    settle('timeup');
    return;
  }
  if (combo > 0 && Date.now() > comboUntil) {
    combo = 0;
    showToast('连击中断');
  }
  flushKeyBuffer();
  dir = nextDir;

  const old = snake.map(s => ({x: s.x, y: s.y, z: s.z}));
  const head = {x: old[0].x + dir.x, y: old[0].y + dir.y, z: old[0].z};
  let stair = 0;
  if (head.x < 0) {
    head.x = COLS - 1;
    if (head.z > 1) { head.z -= 1; stair = -1; ensureLayer(head.z, head); }
    else showHint('wrapLeft', '左边缘环绕:从右侧出来,不会死');
  } else if (head.x >= COLS) {
    head.x = 0;
    const cur = layers[old[0].z];
    if (cur.gate && !cur.gate.open) {
      showToast('大门锁定:吃果 ' + cur.gate.eaten + '/' + cur.gate.needed + ' 开右梯');
    } else {
      head.z += 1;
      stair = 1;
      ensureLayer(head.z, head);
    }
  }
  if (head.y < 0) { head.y = ROWS - 1; showHint('wrapTop', '上边缘环绕:从下侧出来,不会死'); }
  if (head.y >= ROWS) { head.y = 0; showHint('wrapBottom', '下边缘环绕:从上侧出来,不会死'); }
  if (stair !== 0) {
    showHint('stairs', '左右边缘是楼梯:右升左降!');
    if (mode === 'timed') {
      timedEndsAt = Math.max(timedEndsAt - 5000, Date.now() + 1000);
      showToast('换层 -5 秒');
    }
  }

  const eatsHere = layers[head.z].fruits.some(f => f.x === head.x && f.y === head.y);
  const body = eatsHere ? old : old.slice(0, -1);
  const extra = twoPlayer && snake2.length ? snake2 : [];
  const ghosting = Date.now() < ghostUntil;
  const hitWall = layers[head.z].walls.some(w => w.x === head.x && w.y === head.y);
  if (hitWall) {
    head.z += 1;
    ensureLayer(head.z, head);
  }
  if (!ghosting) climbIfColliding(head, body.concat(extra));
  if (head.z > old[0].z) {
    showHint(hitWall ? 'wall' : 'climb', hitWall ? '撞到墙→爬上一层!' : '撞到自己→爬上一层!');
  }

  const eaten = layers[head.z].fruits.find(f => f.x === head.x && f.y === head.y);
  if (eaten) {
    const eatenZ = head.z;
    const eff = eaten.type === 'rainbow' ? RAINBOW_POOL[Math.floor(rand() * RAINBOW_POOL.length)] : eaten.type;
    if (eff === 'up') {
      head.z += 1;
      ensureLayer(head.z, head);
      climbIfColliding(head, old.concat(extra));
    } else if (eff === 'down' && head.z > 1) {
      head.z -= 1;
      climbIfColliding(head, old.concat(extra));
    }
    snake = [head, ...old];
    eat(eaten, eatenZ, eff);
  } else {
    snake = [head, ...old.slice(0, -1)];
  }

  if (snake[0].z !== old[0].z) {
    layerChangeAt = Date.now();
    layerChangeDir = snake[0].z > old[0].z ? 1 : -1;
    playSound(layerChangeDir > 0 ? 'climb' : 'descend');
    if (layerChangeDir > 0) save.stats.climbs++; else save.stats.descents++;
    persist();
  }

  if (Date.now() >= invincibleUntil && Date.now() >= freezeUntil) {
    const lay = layers[snake[0].z];
    if (lay.traps.some(t => t.x === snake[0].x && t.y === snake[0].y)) {
      loseLife('踩中陷阱');
      playSound('bomb');
    }
  }

  if (Date.now() < magnetUntil && !settled) {
    const layM = layers[snake[0].z];
    let pulled;
    do {
      pulled = layM.fruits.find(f => Math.abs(f.x - snake[0].x) <= 2 && Math.abs(f.y - snake[0].y) <= 2);
      if (pulled) eat(pulled, snake[0].z, undefined, 'p1');
    } while (pulled && Date.now() < magnetUntil && !settled);
  }

  if (twoPlayer) step2();

  if (snake[0].z > maxZRun) {
    maxZRun = snake[0].z;
    checkAch();
  }
  if (mode === 'endless' && bestGhost && stepCount === bestGhost.path.length) {
    showToast('影子已到它的终点,而你还在飞!');
    playSound('ach');
  }

  if (ghostRun.length < 8000) ghostRun.push([snake[0].x, snake[0].y, snake[0].z]);
  stepCount++;
}

function eat(f, z, eff, who) {
  if (eff === undefined) eff = f.type;
  const me = (who === 'p2' && snake2.length) ? snake2 : snake;
  combo++;
  runMaxCombo = Math.max(runMaxCombo, combo);
  runFruits++;
  if (combo > (save.stats.maxCombo || 0)) save.stats.maxCombo = combo;
  comboUntil = Date.now() + 20000;
  const cm = 1 + Math.min(4, Math.floor(combo / 8));
  if (combo === 8 || combo === 16 || combo === 24 || combo === 32) showToast('连击 ×' + combo + '!分数 ×' + cm + '!');
  const mult = Date.now() < doubleUntil ? 2 : 1;
  let gain = mult * cm;
  if (f.type === 'gold') gain += 50 * mult * cm;
  const prevScore = score;
  score += gain;
  if (f.type === 'gold') {
    if (lives < 3) {
      lives++;

      showToast('+' + gain + ' 分!');
    }

    playSound('clear');
  }
  save.stats.fruits[f.type] = (save.stats.fruits[f.type] || 0) + 1;
  save.book[f.type] = true;
  if (score > save.best[mode]) save.best[mode] = score;
  persist();
  layers[z].fruits = layers[z].fruits.filter(x => x !== f);
  layers[z].fruits.push(randomFruit(z));
  burst(f.x * GRID + GRID / 2, f.y * GRID + GRID / 2, FRUIT_STYLES[f.type] || '#fff', f.type === 'gold' ? 16 : 9);

  const gate = layers[z].gate;
  if (gate && !gate.open && f.type !== 'bomb') {
    gate.eaten++;
    if (gate.eaten >= gate.needed) {
      gate.open = true;
      save.stats.gates = (save.stats.gates || 0) + 1;
      burst(canvas.width - GRID / 2, canvas.height / 2, '#2b2', 14);
      showToast('大门开启!右边缘恢复升层!');
      playSound('climb');
    } else {
      showToast('大门进度 ' + gate.eaten + '/' + gate.needed);

  }

  const grow = {normal: 0, fast: 0, slow: 0, grow: 2, shrink: -3, reverse: 0, up: 0, down: 0, rainbow: 0, gold: 0, teleport: 0, clock: 0, bomb: 0, double: 0, ghost: 0, scissors: 0, shield: 0, magnet: 0, freeze: 0, harvest: 0}[eff];
  if (grow > 0) {

    for (let i = 0; i < grow; i++) me.push({x: tail.x, y: tail.y, z: tail.z});
  } else {
    for (let i = 0; i < -grow && me.length > 2; i++) me.pop();
  }
  if (f.type === 'scissors') {
    const target = Math.max(2, Math.floor(me.length / 2));

  if (f.type === 'double') { doubleUntil = Date.now() + 10000; showHint('double', '双倍分 10 秒!'); }
  if (f.type === 'ghost') { ghostUntil = Date.now() + 5000; showHint('ghost', '隐身 5 秒,穿身不爬层!'); }
  if (eff === 'fast') { fastUntil = Date.now() + 6000; slowUntil = 0; showHint('fast', '加速 6 秒!'); }
  if (eff === 'slow') { slowUntil = Date.now() + 6000; fastUntil = 0; showHint('slow', '减速 6 秒!'); }
  if (eff === 'clock') { fastUntil = 0; slowUntil = 0; showHint('clock', '速度效果已重置!'); }
  if (eff === 'grow') showHint('grow', '蛇身 +3');
  if (eff === 'shrink') showHint('shrink', '蛇身 -2');
  if (eff === 'reverse') { reverseUntil = Date.now() + 8000; showHint('reverse', '方向反转 8 秒!'); }
  if (f.type === 'shield') { shield = Math.min(2, shield + 1); showHint('shield', '护盾 +1!可抵挡一次伤害'); }
  if (f.type === 'magnet') { magnetUntil = Date.now() + 8000; showHint('magnet', '磁铁 8 秒!附近果子自动入口'); }
  if (f.type === 'freeze') { freezeUntil = Date.now() + 8000; showHint('freeze', '冰霜 8 秒!陷阱失效'); }
  if (f.type === 'harvest') {
    const cur = layers[z].fruits.slice();
    const extra = [];
    for (const q of cur) {
      if (layers[z].fruits.length + extra.length >= 9) break;
      let p = null;
      for (let r = 1; r <= 3 && !p; r++) {
        const cand = [[q.x + r, q.y], [q.x - r, q.y], [q.x, q.y + r], [q.x, q.y - r], [q.x + r, q.y + r], [q.x - r, q.y - r], [q.x + r, q.y - r], [q.x - r, q.y + r]];
        for (const c of cand) {
          const nx = c[0], ny = c[1];
          if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) continue;
          if (layers[z].fruits.some(o => o.x === nx && o.y === ny) || extra.some(o => o.x === nx && o.y === ny)) continue;
          if (layers[z].walls.some(o => o.x === nx && o.y === ny) || layers[z].traps.some(o => o.x === nx && o.y === ny)) continue;
          if (snake.some(s => s.z === z && s.x === nx && s.y === ny)) continue;

  }

    const z2 = snake[0].z;
    let p;

      p = {x: Math.floor(rand() * COLS), y: Math.floor(rand() * ROWS)};

      snake.some(s => s.z === z2 && s.x === p.x && s.y === p.y) ||
      layers[z2].fruits.some(q => q.x === p.x && q.y === p.y) ||
      layers[z2].walls.some(w => w.x === p.x && w.y === p.y) ||

function step2() {
  if (!snake2.length) return;
  dir2 = nextDir2;
  const old2 = snake2.map(s => ({x: s.x, y: s.y, z: s.z}));
  const head2 = {x: old2[0].x + dir2.x, y: old2[0].y + dir2.y, z: old2[0].z};
  if (head2.x < 0) {
    head2.x = COLS - 1;
    if (head2.z > 1) { head2.z -= 1; ensureLayer(head2.z, head2); }
  } else if (head2.x >= COLS) {
    head2.x = 0;
    const cur = layers[old2[0].z];
    if (!(cur.gate && !cur.gate.open)) { head2.z += 1; ensureLayer(head2.z, head2); }
  }
  if (head2.y < 0) head2.y = ROWS - 1;
  if (head2.y >= ROWS) head2.y = 0;

  const eatsHere2 = layers[head2.z].fruits.some(f => f.x === head2.x && f.y === head2.y);
  const body2 = eatsHere2 ? old2 : old2.slice(0, -1);
  const others = body2.concat(snake);
  const hitWall2 = layers[head2.z].walls.some(w => w.x === head2.x && w.y === head2.y);
  if (hitWall2) {
    head2.z += 1;
    ensureLayer(head2.z, head2);
  }
  climbIfColliding(head2, others);

  const eaten2 = layers[head2.z].fruits.find(f => f.x === head2.x && f.y === head2.y);
  if (eaten2) {
    const eatenZ2 = head2.z;
    const eff2 = eaten2.type === 'rainbow' ? RAINBOW_POOL[Math.floor(rand() * RAINBOW_POOL.length)] : eaten2.type;
    if (eff2 === 'up') {
      head2.z += 1;
      ensureLayer(head2.z, head2);
      climbIfColliding(head2, others);
    } else if (eff2 === 'down' && head2.z > 1) {
      head2.z -= 1;
      climbIfColliding(head2, others);
    }
    snake2 = [head2, ...old2];
    eat(eaten2, eatenZ2, eff2, 'p2');
  } else {
    snake2 = [head2, ...old2.slice(0, -1)];
  }

  if (Date.now() >= invincibleUntil && Date.now() >= freezeUntil) {
    const lay2 = layers[snake2[0].z];
    if (lay2.traps.some(t => t.x === snake2[0].x && t.y === snake2[0].y)) {
      loseLife('P2 踩中陷阱');
      playSound('bomb');
    }
  }
}

function loseLife(msg) {
  if (shield > 0) {
    shield--;
    invincibleUntil = Date.now() + 1000;
    burst(snake[0].x * GRID + GRID / 2, snake[0].y * GRID + GRID / 2, '#09f', 12);
    showToast('护盾抵挡了伤害!');
    playSound('block');
    return;
  }
  combo = 0;
  comboUntil = 0;
  lives--;
  burst(snake[0].x * GRID + GRID / 2, snake[0].y * GRID + GRID / 2, '#d33', 16);
  shakeUntil = Date.now() + 200;
  if (lives <= 0) {
    settle('dead');
  } else {
    invincibleUntil = Date.now() + 2000;
    showToast(msg + '!剩 ' + lives + ' 命');
  }
}

function burst(cx, cy, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = (1 + Math.random() * 2.5) * PX;
    particles.push({x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - PX, life: 18 + Math.random() * 16, color: color, size: (2 + Math.random() * 2) * PX});
  }
  if (particles.length > 240) particles = particles.slice(-240);
}

function settle(reason) {
  settled = true;
  settleReason = reason;
  if (mode === 'endless' && score > 0 && ghostRun.length > 30 &&
      (!bestGhost || score > bestGhost.score)) {
    bestGhost = {score: score, path: ghostRun.slice(0, 8000)};
    try {
      localStorage.setItem('snake3d_ghost_endless', JSON.stringify(bestGhost));
    } catch (e) {}
    showToast('新影子诞生!下次它会陪你跑');
  }
  playSound('settle');
  persist();
}

function controlsReversed() {
  return Date.now() < reverseUntil;
}

function fillFruitShape(type, px, py, size) {
  if (type === 'rainbow') {
    const g = ctx.createLinearGradient(px, py, px + size, py + size);
    const t = Date.now() / 300;
    for (let i = 0; i <= 5; i++) {
      g.addColorStop(i / 5, 'hsl(' + Math.floor((t * 60 + i * 60) % 360) + ',85%,55%)');
    }
    ctx.fillStyle = g;
  } else {
    ctx.fillStyle = FRUIT_STYLES[type];
  }
  ctx.fillRect(px, py, size, size);
  if (type === 'bomb' || type === 'shield') {
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.strokeRect(px + 1 * PX, py + 1 * PX, size - 2 * PX, size - 2 * PX);
  } else if (type === 'double') {
    ctx.strokeStyle = 'rgba(246,190,0,' + (0.4 + 0.6 * Math.abs(Math.sin(Date.now() / 200))).toFixed(3) + ')';
    ctx.lineWidth = 2;
    ctx.strokeRect(px + 1 * PX, py + 1 * PX, size - 2 * PX, size - 2 * PX);
  } else if (type === 'rainbow' || type === 'clock' || type === 'ghost' || type === 'magnet' || type === 'freeze') {
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.strokeRect(px + 0.5 * PX, py + 0.5 * PX, size - 1 * PX, size - 1 * PX);
  }
}

let SK = SKINS.classic;

function drawWall(x, y) {
  const px = x * GRID;
  const py = y * GRID;
  ctx.fillStyle = SK.wallFill;
  ctx.fillRect(px, py, GRID, GRID);
  ctx.strokeStyle = SK.wallFrame;
  ctx.lineWidth = 2;
  ctx.strokeRect(px + 3 * PX, py + 3 * PX, GRID - 6 * PX, GRID - 6 * PX);
  ctx.strokeStyle = SK.wallHatch;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(px + 5 * PX, py + GRID - 5 * PX);
  ctx.lineTo(px + GRID - 5 * PX, py + 5 * PX);
  ctx.moveTo(px + 5 * PX, py + 5 * PX);
  ctx.lineTo(px + GRID - 5 * PX, py + GRID - 5 * PX);
  ctx.stroke();
}

function drawTrap(x, y) {
  const px = x * GRID;
  const py = y * GRID;
  ctx.fillStyle = SK.trapPit;
  ctx.fillRect(px + 1 * PX, py + 1 * PX, GRID - 2 * PX, GRID - 2 * PX);
  ctx.fillStyle = SK.trapSpike;
  for (let i = 0; i < 3; i++) {
    const sx = px + 4 * PX + i * 5 * PX;
    ctx.beginPath();
    ctx.moveTo(sx, py + GRID - 4 * PX);
    ctx.lineTo(sx + 2.5 * PX, py + 6 * PX);
    ctx.lineTo(sx + 5 * PX, py + GRID - 4 * PX);
    ctx.closePath();
    ctx.fill();
  }
}

function ensureAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  if (!audioCtx) audioCtx = new AC();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (bgmOn && !bgmTimer) bgmStart();
}
function tone(freq, delay, dur, type, vol, slideTo) {
  const t0 = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  gain.gain.setValueAtTime(vol, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + dur + 0.05);
}
function playSound(name, type) {
  if (!soundOn || !audioCtx) return;
  if (name === 'eat') {
    tone(FRUIT_PITCH[type] || 440, 0, 0.09, 'triangle', 0.12);
  } else if (name === 'climb') {
    tone(330, 0, 0.15, 'sine', 0.12, 660);
  } else if (name === 'descend') {
    tone(660, 0, 0.15, 'sine', 0.12, 330);
  } else if (name === 'reverse') {
    tone(420, 0, 0.09, 'square', 0.07);
    tone(310, 0.11, 0.13, 'square', 0.07);
  } else if (name === 'teleport') {
    tone(180, 0, 0.2, 'sine', 0.12, 720);
  } else if (name === 'bomb') {
    tone(150, 0, 0.22, 'square', 0.1, 55);
  } else if (name === 'block') {
    tone(523, 0, 0.08, 'square', 0.1);
    tone(784, 0.07, 0.12, 'square', 0.1);
  } else if (name === 'ach') {
    tone(660, 0, 0.1, 'triangle', 0.12);
    tone(880, 0.09, 0.16, 'triangle', 0.12);
  } else if (name === 'settle') {
    tone(659, 0, 0.16, 'triangle', 0.12);
    tone(523, 0.15, 0.16, 'triangle', 0.12);
    tone(392, 0.3, 0.3, 'triangle', 0.12);
  } else if (name === 'clear') {
    tone(523, 0, 0.14, 'triangle', 0.12);
    tone(659, 0.13, 0.14, 'triangle', 0.12);
    tone(784, 0.26, 0.14, 'triangle', 0.12);
    tone(1047, 0.39, 0.32, 'triangle', 0.12);
  }
}

function drawReplay() {
  const path = bestGhost.path;
  ctx.fillStyle = SK.overlay;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (!replayDone) {
    replayIdx = Math.min(path.length - 1, replayIdx + 0.28);
    if (replayIdx >= path.length - 1) replayDone = true;
  }
  const idx = Math.floor(replayIdx);
  const z = path[idx][2];
  ctx.globalAlpha = 0.12;
  ctx.fillStyle = SK.text;
  for (let i = 0; i < path.length; i += 2) {
    if (path[i][2] !== z) continue;
    ctx.fillRect(path[i][0] * GRID + 6 * PX, path[i][1] * GRID + 6 * PX, GRID - 12 * PX, GRID - 12 * PX);
  }
  ctx.globalAlpha = 0.9;
  ctx.fillStyle = SK.glow ? '#ffd54f' : '#b8860b';
  for (let i = Math.max(0, idx - 6); i <= idx; i++) {
    const p = path[i];
    if (p[2] !== z) continue;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(p[0] * GRID + 2 * PX, p[1] * GRID + 2 * PX, GRID - 4 * PX, GRID - 4 * PX, 5 * PX);
    else ctx.rect(p[0] * GRID + 2 * PX, p[1] * GRID + 2 * PX, GRID - 4 * PX, GRID - 4 * PX);
    ctx.fill();
  }
  const hp = path[idx];
  ctx.fillStyle = SK.head;
  ctx.beginPath();
  ctx.arc(hp[0] * GRID + GRID / 2, hp[1] * GRID + GRID / 2, 9 * PX, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = SK.text;
  ctx.font = 'bold ' + Math.round(18 * PX) + 'px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('巅峰回放 · 第 ' + (idx + 1) + '/' + path.length + ' 步', canvas.width / 2, 34 * PX);
  ctx.font = Math.round(12 * PX) + 'px sans-serif';

  if (replayDone) {
    ctx.font = 'bold ' + Math.round(13 * PX) + 'px sans-serif';
    ctx.fillText('回放结束 · 再点回放按钮退出', canvas.width / 2, canvas.height - 16 * PX);
  }
  ctx.textAlign = 'left';
}

function checkAch() {
  const st = save.stats;
  const tot = Object.values(st.fruits).reduce((a, b) => a + b, 0);
  const book = FRUIT_ORDER.filter(e => save.book[e[1]]).length;
  const cond = {
    first_climb: st.climbs >= 1,
    tower10: maxZRun >= 10,
    stairs_down: st.descents >= 1,
    score100: score >= 100,
    score500: score >= 500,
    combo16: (st.maxCombo || 0) >= 16,
    combo32: (st.maxCombo || 0) >= 32,
    gate1: (st.gates || 0) >= 1,
    gate3: (st.gates || 0) >= 3,
    fruit100: tot >= 100,
    fruit500: tot >= 500,
    book10: book >= 10,
    book20: book >= 20,
    four_new: ['shield', 'magnet', 'freeze', 'harvest'].every(t => (st.fruits[t] || 0) >= 1),
    gold_life: (st.goldLives || 0) >= 10,
    skin_secret: save.skins.bamboo || save.skins.cyber,
    clear999: score >= 999999999,
    daily50: mode === 'daily' && score >= 50,
    fog5: mode === 'fog' && maxZRun >= 5,
    zen20: mode === 'zen' && maxZRun >= 20,
    ghost_pass: mode === 'endless' && !!bestGhost && score > bestGhost.score
  };
  for (const a of ACH) {
    if (cond[a.id] && !save.ach[a.id]) {
      save.ach[a.id] = true;
      persist();
      showToast('🏆 成就解锁:' + a.name);
      playSound('ach');
    }
  }
}

function draw() {
  const z = snake[0].z;
  ensureLayer(z);
  SK = SKINS[save.skin] || SKINS.classic;
  if (mode === 'fog' && started && !cleared && !settled && !bookOpen && !achOpen) {
    SK = Object.assign({}, SK, {text: '#dfe8ff'});
  }
  ctx.save();
  if (Date.now() < shakeUntil) {
    ctx.translate((Math.random() - 0.5) * 8 * PX, (Math.random() - 0.5) * 8 * PX);
  }
  ctx.fillStyle = SK.board;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.globalAlpha = 0.15;
  for (const dz of [z - 1, z + 1]) {
    if (!layers[dz]) continue;
    for (const f of layers[dz].fruits) {
      fillFruitShape(f.type, f.x * GRID, f.y * GRID, GRID);
    }
    for (const t of layers[dz].traps) {
      drawTrap(t.x, t.y);
    }
  }
  ctx.globalAlpha = 1;

  for (const w of layers[z].walls) {
    drawWall(w.x, w.y);
  }
  for (const t of layers[z].traps) {
    if (Date.now() < freezeUntil) ctx.globalAlpha = 0.25;
    drawTrap(t.x, t.y);
    ctx.globalAlpha = 1;
  }

  if (mode === 'endless' && started && !settled && bestGhost && stepCount > 0) {
    const gi = Math.min(stepCount, bestGhost.path.length - 1);
    const gh = bestGhost.path[gi];
    if (gh[2] === z) {
      ctx.globalAlpha = 0.3;
      ctx.fillStyle = SK.glow ? '#9aa8b8' : '#555';
      for (let i = Math.max(0, gi - 5); i <= gi; i++) {
        const gp = bestGhost.path[i];
        if (gp[2] !== z) continue;
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(gp[0] * GRID + 3 * PX, gp[1] * GRID + 3 * PX, GRID - 6 * PX, GRID - 6 * PX, 4 * PX);
        else ctx.rect(gp[0] * GRID + 3 * PX, gp[1] * GRID + 3 * PX, GRID - 6 * PX, GRID - 6 * PX);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }

  const INSET = 3 * PX;
  const RADIUS = 5 * PX;
  const onLayer = snake.filter(s => s.z === z);

  if (twoPlayer && snake2.length) {
    const p2col = SK.p2 || '#555';
    ctx.fillStyle = p2col;
    const on2 = snake2.filter(s => s.z === z);
    for (const s of on2) {
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(s.x * GRID + 4 * PX, s.y * GRID + 4 * PX, GRID - 8 * PX, GRID - 8 * PX, 5 * PX);
      else ctx.rect(s.x * GRID + 4 * PX, s.y * GRID + 4 * PX, GRID - 8 * PX, GRID - 8 * PX);
      ctx.fill();
    }
    if (on2.length) {
      ctx.fillStyle = SK.head;
      ctx.beginPath();
      ctx.arc(on2[0].x * GRID + GRID / 2, on2[0].y * GRID + GRID / 2, 8 * PX, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(on2[0].x * GRID + GRID / 2 - 3 * PX, on2[0].y * GRID + GRID / 2 - 2 * PX, 2.2 * PX, 0, Math.PI * 2);
      ctx.arc(on2[0].x * GRID + GRID / 2 + 3 * PX, on2[0].y * GRID + GRID / 2 - 2 * PX, 2.2 * PX, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  const blink = Date.now() < invincibleUntil && Math.floor(Date.now() / 120) % 2 === 0;
  const ghosting = Date.now() < ghostUntil;
  ctx.globalAlpha = blink ? 0.25 : (ghosting ? 0.45 : 1);
  ctx.fillStyle = SK.snake;
  for (let i = 0; i + 1 < onLayer.length; i++) {
    const a = onLayer[i], b = onLayer[i + 1];
    if (Math.abs(a.x - b.x) + Math.abs(a.y - b.y) !== 1) continue;
    if (a.x === b.x) {
      const y = Math.min(a.y, b.y);
      ctx.fillRect(a.x * GRID + INSET, y * GRID + GRID / 2, GRID - INSET * 2, GRID);
    } else {
      const x = Math.min(a.x, b.x);
      ctx.fillRect(x * GRID + GRID / 2, a.y * GRID + INSET, GRID, GRID - INSET * 2);
    }
  }
  for (let i = 1; i < onLayer.length; i++) {
    const s = onLayer[i];
    const tailN = onLayer.length - 1 - i;
    const inset = tailN === 0 ? 6.5 * PX : (tailN === 1 ? 5 * PX : INSET);
    const rad = tailN === 0 ? 4 * PX : (tailN === 1 ? 4.5 * PX : RADIUS);
    ctx.beginPath();
    if (ctx.roundRect) {
      ctx.roundRect(s.x * GRID + inset, s.y * GRID + inset, GRID - inset * 2, GRID - inset * 2, rad);
    } else {
      ctx.rect(s.x * GRID + inset, s.y * GRID + inset, GRID - inset * 2, GRID - inset * 2);
    }
    ctx.fill();
  }

  const h = snake[0];
  const cx = h.x * GRID + GRID / 2;
  const cy = h.y * GRID + GRID / 2;
  const fx = cx + dir.x * 7 * PX;
  const fy = cy + dir.y * 7 * PX;
  const px = -dir.y * 4 * PX;
  const py = dir.x * 4 * PX;
  ctx.globalAlpha = blink ? 0.25 : (ghosting ? 0.45 : 1);
  ctx.fillStyle = SK.head;
  ctx.beginPath();
  ctx.arc(cx, cy, 9.5 * PX, 0, Math.PI * 2);
  ctx.fill();
  if (SK.glow) {
    ctx.save();
    ctx.globalAlpha *= 0.22;
    ctx.fillStyle = SK.snake;
    for (let i = 0; i < onLayer.length; i++) {
      const s = onLayer[i];
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(s.x * GRID - 2 * PX, s.y * GRID - 2 * PX, GRID + 4 * PX, GRID + 4 * PX, 7 * PX);
      else ctx.rect(s.x * GRID - 2 * PX, s.y * GRID - 2 * PX, GRID + 4 * PX, GRID + 4 * PX);
      ctx.fill();
    }
    ctx.beginPath();
    ctx.arc(cx, cy, 12.5 * PX, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  ctx.strokeStyle = SK.tongue;
  ctx.lineWidth = 2;
  ctx.beginPath();
  const tx = cx + dir.x * 15 * PX;
  const ty = cy + dir.y * 15 * PX;
  ctx.moveTo(cx + dir.x * 9 * PX, cy + dir.y * 9 * PX);
  ctx.lineTo(tx, ty);
  ctx.moveTo(tx, ty);
  ctx.lineTo(tx + dir.x * 2.5 * PX - dir.y * 2.5 * PX, ty + dir.y * 2.5 * PX + dir.x * 2.5 * PX);
  ctx.moveTo(tx, ty);
  ctx.lineTo(tx + dir.x * 2.5 * PX + dir.y * 2.5 * PX, ty + dir.y * 2.5 * PX - dir.x * 2.5 * PX);
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.fillRect(fx + px - 2 * PX, fy + py - 2 * PX, 4 * PX, 4 * PX);
  ctx.fillRect(fx - px - 2 * PX, fy - py - 2 * PX, 4 * PX, 4 * PX);
  ctx.fillStyle = '#000';
  ctx.fillRect(fx + px - 1 * PX, fy + py - 1 * PX, 2 * PX, 2 * PX);
  ctx.fillRect(fx - px - 1 * PX, fy - py - 1 * PX, 2 * PX, 2 * PX);
  ctx.globalAlpha = 1;

  for (const f of layers[z].fruits) {
    fillFruitShape(f.type, f.x * GRID, f.y * GRID, GRID);
  }

  if (mode === 'fog' && started && !cleared && !settled) {
    const fogGrad = ctx.createRadialGradient(cx, cy, 70 * PX, cx, cy, 135 * PX);
    fogGrad.addColorStop(0, 'rgba(8,10,18,0)');
    fogGrad.addColorStop(1, 'rgba(8,10,18,0.96)');
    ctx.fillStyle = fogGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.12 * PX;
    p.life--;
    if (p.life <= 0) {
      particles.splice(i, 1);
      continue;
    }
    ctx.globalAlpha = Math.min(1, p.life / 12);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  ctx.fillStyle = SK.text;
  ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('得分: ' + score + '  第' + z + '层', 10, 20);

  if (combo > 0 && started && !cleared && !settled) {
    const cm = 1 + Math.min(4, Math.floor(combo / 8));
    ctx.fillStyle = SK.comboCol;
    ctx.font = 'bold 14px sans-serif';
    ctx.fillText('连击 ×' + combo + (cm > 1 ? '  分数×' + cm : ''), 10, 40);
  }

  if (mode === 'daily' && started && !settled) {
    const d = new Date();
    ctx.fillStyle = SK.text;
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('每日挑战 ' + d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(), canvas.width / 2, 20);
    ctx.textAlign = 'left';
  }
  if (mode === 'timed' && started && !settled) {
    const left = Math.max(0, timedEndsAt - Date.now());
    const mm = Math.floor(left / 60000);
    const ss = Math.floor(left % 60000 / 1000);
    ctx.fillStyle = left <= 10000 ? '#d00' : SK.text;
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('剩余 ' + mm + ':' + (ss < 10 ? '0' : '') + ss, canvas.width / 2, 20);
  }
  if (started && !settled) {
    ctx.fillStyle = Date.now() < invincibleUntil ? (SK.glow ? '#ff5c7a' : '#a00') : SK.text;
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('命 ×' + lives, canvas.width - 10, 20);
    ctx.textAlign = 'left';
  }
  const gate = layers[z].gate;
  if (gate && started && !settled) {
    ctx.fillStyle = gate.open ? '#1a1' : '#c33';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(gate.open ? '大门已开启' : '大门 ' + gate.eaten + '/' + gate.needed, canvas.width - 10, 64);
    ctx.textAlign = 'left';
    const gx = canvas.width - GRID + 3 * PX;
    const gy = canvas.height / 2 - GRID / 2 + 2 * PX;
    ctx.fillStyle = gate.open
      ? 'rgba(40,180,80,' + (0.55 + 0.45 * Math.abs(Math.sin(Date.now() / 250))).toFixed(3) + ')'
      : '#3a3f4a';
    ctx.fillRect(gx, gy, GRID - 6 * PX, GRID - 4 * PX);
    if (!gate.open) {
      ctx.fillStyle = '#c33';
      ctx.fillRect(gx, gy + (GRID - 4 * PX) / 2 - 2 * PX, GRID - 6 * PX, 4 * PX);
    }
  }
  ctx.textAlign = 'left';

  const now = Date.now();
  let buffY = combo > 0 ? 58 : 40;
  if (shield > 0) {
    ctx.fillStyle = SK.glow ? '#59c9ff' : '#09f';
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText('护盾 ×' + shield, 10, buffY);
    buffY += 18;
  }
  if (now < magnetUntil) {
    ctx.fillStyle = SK.glow ? '#b48cff' : '#90f';
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText('磁铁 ' + Math.ceil((magnetUntil - now) / 1000) + 's', 10, buffY);
    buffY += 18;
  }
  if (now < freezeUntil) {
    ctx.fillStyle = SK.glow ? '#8fd8ff' : '#6cf';
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText('陷阱失效 ' + Math.ceil((freezeUntil - now) / 1000) + 's', 10, buffY);
    buffY += 18;
  }
  if (now < fastUntil) {
    ctx.fillStyle = SK.fastCol;
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText('加速 ' + Math.ceil((fastUntil - now) / 1000) + 's', 10, buffY);
    buffY += 18;
  } else if (now < slowUntil) {
    ctx.fillStyle = SK.slowCol;
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText('减速 ' + Math.ceil((slowUntil - now) / 1000) + 's', 10, buffY);
    buffY += 18;
  }
  if (now < doubleUntil) {
    ctx.fillStyle = SK.dblCol;
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText('双倍分 ' + Math.ceil((doubleUntil - now) / 1000) + 's', 10, buffY);
    buffY += 18;
  }
  if (now < ghostUntil) {
    ctx.fillStyle = SK.ghostCol;
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText('隐身 ' + Math.ceil((ghostUntil - now) / 1000) + 's', 10, buffY);
  }

  if (controlsReversed()) {
    ctx.fillStyle = '#f80';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'right';
    const secs = Math.ceil((reverseUntil - Date.now()) / 1000);
    ctx.fillText('方向反转 ' + secs + 's', canvas.width - 10, 42);
    ctx.textAlign = 'left';
  }

  const t = Date.now() - layerChangeAt;
  if (started && !paused && !cleared && t < 500) {
    const k = 1 - t / 500;
    ctx.fillStyle = 'rgba(255,255,255,' + (0.45 * k).toFixed(3) + ')';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.globalAlpha = k;
    ctx.fillStyle = SK.text;
    ctx.font = 'bold 26px sans-serif';
    ctx.textAlign = 'center';
    const bounce = Math.round(-18 * Math.sin((1 - k) * Math.PI));
    ctx.fillText((layerChangeDir > 0 ? '↑ 进入第 ' : '↓ 回到第 ') + z + ' 层', canvas.width / 2, canvas.height / 2 + bounce);
    ctx.globalAlpha = 1;
  }

  if (toastMsg) {
    const age = Date.now() - toastMsg.at;
    if (age < 1000) {
      const k = Math.min(1, age / 150, (1000 - age) / 250);
      ctx.globalAlpha = k;
      ctx.fillStyle = SK.text;
      ctx.font = 'bold 15px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(toastMsg.text, canvas.width / 2, 44);
      ctx.globalAlpha = 1;
      ctx.textAlign = 'left';
    }
  }

  if (bookOpen) {
    drawBook();
  } else if (achOpen) {
    drawAch();
  } else if (replayOpen) {
    drawReplay();
  } else if (settled) {
    ctx.fillStyle = SK.overlay;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = SK.text;
    ctx.font = 'bold 28px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(settleReason === 'dead' ? '命用完了!' : '时间到!', canvas.width / 2, canvas.height / 2 - 40);
    ctx.font = '16px sans-serif';
    ctx.fillText(MODE_NAMES[mode] + '模式  得分: ' + score, canvas.width / 2, canvas.height / 2 - 8);
    ctx.fillText(score > bestAtStart ? '新纪录!' : '最高分: ' + save.best[mode], canvas.width / 2, canvas.height / 2 + 18);
    ctx.fillText('到达第 ' + maxZRun + ' 层 · 最长连击 ×' + runMaxCombo + ' · 吃果 ' + runFruits + ' 个', canvas.width / 2, canvas.height / 2 + 42);
    ctx.fillText('按 R 或点击开始按钮再来一局', canvas.width / 2, canvas.height / 2 + 66);
  } else if (cleared) {
    ctx.fillStyle = SK.overlay;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = SK.text;
    ctx.font = 'bold 28px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('通关!', canvas.width / 2, canvas.height / 2 - 20);
    ctx.font = '16px sans-serif';
    ctx.fillText('得分: ' + score, canvas.width / 2, canvas.height / 2 + 10);
    ctx.fillText('最高分: ' + save.best.endless, canvas.width / 2, canvas.height / 2 + 32);
    ctx.fillText('按 R 或点击开始按钮再来一局', canvas.width / 2, canvas.height / 2 + 54);
  } else if (!started) {
    ctx.fillStyle = SK.overlay;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.globalAlpha = 0.3;
    ctx.fillStyle = SK.snake;
    for (const s of demoSnake) {
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(s.x * GRID + INSET, s.y * GRID + INSET, GRID - INSET * 2, GRID - INSET * 2, RADIUS);
      } else {
        ctx.rect(s.x * GRID + INSET, s.y * GRID + INSET, GRID - INSET * 2, GRID - INSET * 2);
      }
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = SK.text;
    ctx.font = 'bold 24px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('贪吃蛇', canvas.width / 2, canvas.height / 2 - 34);
    ctx.font = '16px sans-serif';
    ctx.fillText(MODE_DESC[mode], canvas.width / 2, canvas.height / 2 - 4);
    ctx.fillText('最高分: ' + save.best[mode], canvas.width / 2, canvas.height / 2 + 20);
    ctx.fillText('点击开始按钮开始游戏', canvas.width / 2, canvas.height / 2 + 44);
    ctx.font = '12px sans-serif';
    ctx.globalAlpha = 0.6;
    ctx.fillText(twoPlayer ? 'P1 方向键 · P2 W/A/S/D · 空格或 F 暂停' : '方向键移动 · 空格或 F 暂停', canvas.width / 2, canvas.height / 2 + 66);
    ctx.globalAlpha = 1;
  } else if (paused) {
    ctx.fillStyle = SK.overlay;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = SK.text;
    ctx.font = 'bold 22px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('暂停中', canvas.width / 2, 46);
    ctx.font = '13px sans-serif';
    ctx.fillText('按空格或点击暂停按钮继续', canvas.width / 2, 68);
    ctx.fillText(MODE_NAMES[mode] + '模式最高分: ' + save.best[mode] + '   爬层: 升 ' + save.stats.climbs + ' / 降 ' + save.stats.descents, canvas.width / 2, 92);
    ctx.fillText(twoPlayer ? 'P1 方向键 · P2 W/A/S/D · 空格或 F 暂停' : '方向键移动 · 右缘升层左缘降层 · 空格或 F 暂停', canvas.width / 2, 116);
    ctx.fillText(twoPlayer ? '谁吃果全场加分 · 队友身体可爬 · R 结算后重开' : '撞身撞墙爬层 · R 键结算后秒重开 · 点"图鉴"看果子', canvas.width / 2, 138);
    ctx.textAlign = 'left';
  }
  ctx.restore();
}

function reset() {
  snake = [
    {x: 10, y: 10, z: 1},
    {x: 9, y: 10, z: 1},
    {x: 8, y: 10, z: 1},
    {x: 7, y: 10, z: 1},
    {x: 6, y: 10, z: 1}
  ];
  dir = {x: 1, y: 0};
  nextDir = dir;
  score = 0;
  lives = 3;
  invincibleUntil = 0;
  settled = false;
  settleReason = '';
  bestAtStart = save.best[mode] || 0;
  rand = mulberry32(mode === 'daily' ? dailySeed() : (Date.now() | 0));
  timedEndsAt = mode === 'timed' ? Date.now() + 180000 : 0;
  timedPauseLeft = 0;
  fastUntil = 0;
  slowUntil = 0;
  doubleUntil = 0;
  ghostUntil = 0;
  reverseUntil = 0;
  combo = 0;
  comboUntil = 0;
  shield = 0;
  magnetUntil = 0;
  freezeUntil = 0;
  maxZRun = 1;
  ghostRun = [];
  stepCount = 0;
  konamiUsed = false;
  particles = [];
  shakeUntil = 0;
  runMaxCombo = 0;
  runFruits = 0;
  layers = {};
  if (twoPlayer) {
    snake2 = [
      {x: 10, y: 14, z: 1},
      {x: 11, y: 14, z: 1},
      {x: 12, y: 14, z: 1},
      {x: 13, y: 14, z: 1},
      {x: 14, y: 14, z: 1}
    ];
    dir2 = {x: -1, y: 0};
    nextDir2 = dir2;
  } else {
    snake2 = [];
  }
  ensureLayer(1);
  paused = false;
  bookOpen = false;
  cleared = false;
  pauseBtn.textContent = '暂停';
}

function applyDir(d) {
  if (controlsReversed()) d = {x: -d.x, y: -d.y};
  if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d;
}
let keyBuffer = [];
function flushKeyBuffer() {
  if (!keyBuffer.length) return;
  const nd = keyBuffer[keyBuffer.length - 1];
  if (nd.x !== -dir.x || nd.y !== -dir.y) nextDir = nd;
  keyBuffer = [];
}
function applyDir2(d) {
  if (controlsReversed()) d = {x: -d.x, y: -d.y};
  if (d.x !== -dir2.x || d.y !== -dir2.y) nextDir2 = d;
}

document.addEventListener('click', e => {
  if (e.target && e.target.tagName === 'BUTTON') e.target.blur();
});
document.addEventListener('keydown', e => {
  if (e.isComposing) return;

  if (/^[a-z0-9]$/i.test(e.key)) {
    keyBuf = (keyBuf + e.key.toLowerCase()).slice(-8);
    if (keyBuf.includes('zhu') && !save.skins.bamboo) {
      save.skins.bamboo = true;
      persist();
      showToast('隐藏皮肤解锁:翠玉竹林!');
      checkAch();
    }
    if (keyBuf.includes('2077') && !save.skins.cyber) {
      save.skins.cyber = true;
      persist();
      showToast('隐藏皮肤解锁:赛博2077!');
      checkAch();
    }
  }

  konamiBuf.push(e.code);
  if (konamiBuf.length > 10) konamiBuf.shift();
  if (konamiBuf.join(',') === 'ArrowUp,ArrowUp,ArrowDown,ArrowDown,ArrowLeft,ArrowLeft,ArrowRight,ArrowRight,KeyB,KeyA') {
    konamiBuf = [];
    if (started && !settled && !konamiUsed) {
      konamiUsed = true;
      shield = 2;
      showToast('秘技发现:护盾拉满!');
      playSound('ach');
    }
  }

  if (e.code === 'KeyR') {
    if (bookOpen || achOpen || replayOpen) return;
    if (started && (settled || cleared)) {
      e.preventDefault();
      reset();
      started = true;
      if (soundOn) ensureAudio();
    }
    return;
  }

  if (e.code === 'KeyF') {
    if (bookOpen || achOpen || replayOpen) return;
    if (started && !cleared && !settled) {
      e.preventDefault();
      togglePause();
    }
    return;
  }

  if (e.code === 'Space') {
    e.preventDefault();
    if (bookOpen) {
      bookOpen = false;
      return;
    }
    if (achOpen) {
      achOpen = false;
      return;
    }
    if (replayOpen) {
      replayOpen = false;
      return;
    }
    if (started && !cleared && !settled) togglePause();
    return;
  }

  if (!started || cleared || settled) return;

  const keyMap = {
    ArrowUp:    {x: 0, y: -1},
    ArrowDown:  {x: 0, y: 1},
    ArrowLeft:  {x: -1, y: 0},
    ArrowRight: {x: 1, y: 0}
  };
  const buffered = [];
  let d = keyMap[e.code];
  if (!d) return;
  e.preventDefault();
  if (twoPlayer && snake2.length) {
    const km2 = {KeyW: {x: 0, y: -1}, KeyS: {x: 0, y: 1}, KeyA: {x: -1, y: 0}, KeyD: {x: 1, y: 0}};
    if (km2[e.code]) { applyDir2(km2[e.code]); return; }
  }
  if (d.x === -dir.x && d.y === -dir.y) {
    const nd = controlsReversed() ? {x: d.x, y: d.y} : d;
    buffered.length = 0;
    buffered.push(nd);
    keyBuffer = buffered;
    return;
  }
  applyDir(d);
  keyBuffer = buffered;
});

function tick() {
  try {
    if (!started) demoStep();
    step();
  } catch (e) {
    console.error('tick error:', e);
    showToast('游戏异常已自愈');
  }
  let speed = Number(speedInput.value) - Math.min(80, score * 2) - Math.min(32, (snake[0].z - 1) * 4);
  if (Date.now() < fastUntil) speed -= 60;
  if (Date.now() < slowUntil) speed += 60;
  speed = Math.max(75, Math.min(600, speed));
  setTimeout(tick, speed);
}
tick();

function shadowBlob(x, y, pad) {
  sctx.beginPath();
  if (sctx.roundRect) sctx.roundRect(x - pad, y - pad, GRID - 4 + pad * 2, GRID - 4 + pad * 2, 5 + pad);
  else sctx.rect(x - pad, y - pad, GRID - 4 + pad * 2, GRID - 4 + pad * 2);
  sctx.fill();
}

function drawShadow() {
  const w = shadowCv.width;
  const h = shadowCv.height;
  sctx.setTransform(1, 0, 0, 1, 0, 0);
  sctx.clearRect(0, 0, w, h);
  const S = Math.max(w, h) / (COLS * GRID);
  sctx.translate((w - COLS * GRID * S) / 2, (h - ROWS * GRID * S) / 2);
  sctx.scale(S, S);
  const src = started ? snake : demoSnake;
  const z = src[0].z;
  const srcs = (twoPlayer && snake2.length && started) ? [src, snake2] : [src];
  for (const arr of srcs) {
    const zz = arr[0].z;
    sctx.fillStyle = SK.snake;
    for (const s of arr) {
      if (s.z !== zz) continue;
      const bx = s.x * GRID + 2;
      const by = s.y * GRID + 2;
      sctx.globalAlpha = SK.glow ? 0.018 : 0.03;
      shadowBlob(bx, by, 16);
      sctx.globalAlpha = SK.glow ? 0.03 : 0.045;
      shadowBlob(bx, by, 7);
      sctx.globalAlpha = SK.glow ? 0.05 : 0.07;
      shadowBlob(bx, by, 0);
    }
  }
  const lay = layers[z];
  if (lay) {
    for (const f of lay.fruits) {
      sctx.fillStyle = FRUIT_STYLES[f.type];
      sctx.globalAlpha = SK.glow ? 0.015 : 0.025;
      sctx.fillRect(f.x * GRID - 5, f.y * GRID - 5, GRID + 8, GRID + 8);
      sctx.globalAlpha = SK.glow ? 0.04 : 0.055;
      sctx.fillRect(f.x * GRID + 1, f.y * GRID + 1, GRID - 2, GRID - 2);
    }
  }
  sctx.globalAlpha = 1;
  sctx.setTransform(1, 0, 0, 1, 0, 0);
}

function frame() {
  drawShadow();
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
