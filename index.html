<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>贪吃蛇</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #eee;
  }
  canvas {
    background: #fff;
    border: 2px solid #000;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: #000;
  }
  .controls button {
    padding: 4px 14px;
    font-size: 14px;
    border: 1px solid #000;
    background: #fff;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="game" width="400" height="400"></canvas>
  <div class="controls">
    <button id="startBtn">开始</button>
    <button id="pauseBtn">暂停</button>
    <button id="restartBtn">重新开始</button>
    <label for="speed">速度:</label>
    <input type="range" id="speed" min="80" max="300" step="10" value="150">
    <span id="speedLabel">150ms</span>
  </div>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const GRID = 20;
const COLS = canvas.width / GRID;
const ROWS = canvas.height / GRID;

const speedInput = document.getElementById('speed');
const speedLabel = document.getElementById('speedLabel');
speedInput.addEventListener('input', () => {
  speedLabel.textContent = speedInput.value + 'ms';
});

const pauseBtn = document.getElementById('pauseBtn');
const startBtn = document.getElementById('startBtn');
const restartBtn = document.getElementById('restartBtn');
pauseBtn.addEventListener('click', () => {
  if (started && !cleared) togglePause();
});
startBtn.addEventListener('click', () => {
  if (!started || cleared) {
    reset();
    started = true;
  }
});
restartBtn.addEventListener('click', () => {
  reset();
  started = true;
});
function togglePause() {
  paused = !paused;
  pauseBtn.textContent = paused ? '继续' : '暂停';
}

let started = false;
let paused = false;
let cleared = false;
let score = 0;
let speedOffset = 0;
let reverseUntil = 0;
let layerChangeAt = 0;
let layerChangeDir = 0;
let toastMsg = null;
const hintsShown = {};

function showToast(text) {
  toastMsg = {text: text, at: Date.now()};
}
function showHint(key, text) {
  if (hintsShown[key]) return;
  hintsShown[key] = true;
  showToast(text);
}

let snake = [{x: 10, y: 10, z: 1}];
let dir = {x: 1, y: 0};
let nextDir = dir;

const FRUIT_STYLES = {
  normal:  '#f00',
  fast:    '#0a0',
  slow:    '#06c',
  grow:    '#c90',
  shrink:  '#a0c',
  reverse: '#f80',
  up:      '#f0f',
  down:    '#0cc'
};
const BASE_POOL = ['normal','normal','normal','normal','fast','slow','grow','shrink','reverse'];

let layers = {};
function ensureLayer(z) {
  if (!layers[z]) {
    layers[z] = {fruits: []};
    for (let i = 0; i < 3; i++) layers[z].fruits.push(randomFruit(z));
  }
}
function fruitPool(z) {
  return z >= 2 ? BASE_POOL.concat(['up', 'down']) : BASE_POOL;
}
function randomFruit(z) {
  const pool = fruitPool(z);
  const fruits = layers[z].fruits;
  let p;
  do {
    p = {
      x: Math.floor(Math.random() * COLS),
      y: Math.floor(Math.random() * ROWS)
    };
  } while (snake.some(s => s.z === z && s.x === p.x && s.y === p.y) ||
           fruits.some(f => f.x === p.x && f.y === p.y));
  p.type = pool[Math.floor(Math.random() * pool.length)];
  return p;
}
ensureLayer(1);

function climbIfColliding(head, body) {
  for (let i = 0; i < 10 && body.some(s => s.z === head.z && s.x === head.x && s.y === head.y); i++) {
    head.z += 1;
    ensureLayer(head.z);
  }
}

function step() {
  if (!started || paused || cleared) return;
  dir = nextDir;

  const old = snake.map(s => ({x: s.x, y: s.y, z: s.z}));
  const head = {x: old[0].x + dir.x, y: old[0].y + dir.y, z: old[0].z};
  let wrapped = false;
  if (head.x < 0) { head.x = COLS - 1; wrapped = true; }
  if (head.x >= COLS) { head.x = 0; wrapped = true; }
  if (head.y < 0) { head.y = ROWS - 1; wrapped = true; }
  if (head.y >= ROWS) { head.y = 0; wrapped = true; }
  if (wrapped) showHint('wrap', '穿墙:从对侧出来,不会死');

  const eatsHere = layers[head.z].fruits.some(f => f.x === head.x && f.y === head.y);
  const body = eatsHere ? old : old.slice(0, -1);
  climbIfColliding(head, body);
  if (head.z > old[0].z) showHint('climb', '撞到自己→爬上一层!');

  const eaten = layers[head.z].fruits.find(f => f.x === head.x && f.y === head.y);
  if (eaten) {
    const eatenZ = head.z;
    if (eaten.type === 'up') {
      head.z += 1;
      ensureLayer(head.z);
      climbIfColliding(head, old);
    } else if (eaten.type === 'down' && head.z > 1) {
      head.z -= 1;
      climbIfColliding(head, old);
    }
    snake = [head, ...old];
    eat(eaten, eatenZ);
  } else {
    snake = [head, ...old.slice(0, -1)];
  }

  if (snake[0].z !== old[0].z) {
    layerChangeAt = Date.now();
    layerChangeDir = snake[0].z > old[0].z ? 1 : -1;
  }
}

function eat(f, z) {
  const prevScore = score;
  score++;
  if (Math.floor(score / 100) > Math.floor(prevScore / 100)) showToast(score + ' 分!');
  if (score >= 999999999) cleared = true;
  layers[z].fruits = layers[z].fruits.filter(x => x !== f);
  layers[z].fruits.push(randomFruit(z));

  const grow = {normal: 0, fast: 0, slow: 0, grow: 2, shrink: -3, reverse: 0, up: 0, down: 0}[f.type];
  if (grow > 0) {
    const tail = snake[snake.length - 1];
    for (let i = 0; i < grow; i++) snake.push({x: tail.x, y: tail.y, z: tail.z});
  } else {
    for (let i = 0; i < -grow && snake.length > 2; i++) snake.pop();
  }

  if (f.type === 'fast') { speedOffset -= 30; showHint('fast', '变快了!'); }
  if (f.type === 'slow') { speedOffset += 30; showHint('slow', '变慢了!'); }
  if (f.type === 'grow') showHint('grow', '蛇身 +3');
  if (f.type === 'shrink') showHint('shrink', '蛇身 -2');
  if (f.type === 'reverse') { reverseUntil = Date.now() + 8000; showHint('reverse', '方向反转 8 秒!'); }
}

function controlsReversed() {
  return Date.now() < reverseUntil;
}

function draw() {
  const z = snake[0].z;
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.globalAlpha = 0.15;
  for (const dz of [z - 1, z + 1]) {
    if (!layers[dz]) continue;
    for (const f of layers[dz].fruits) {
      ctx.fillStyle = FRUIT_STYLES[f.type];
      ctx.fillRect(f.x * GRID, f.y * GRID, GRID, GRID);
    }
  }
  ctx.globalAlpha = 1;

  const INSET = 3;
  const RADIUS = 5;
  const onLayer = snake.filter(s => s.z === z);

  ctx.fillStyle = '#000';
  for (let i = 0; i + 1 < onLayer.length; i++) {
    const a = onLayer[i], b = onLayer[i + 1];
    if (Math.abs(a.x - b.x) + Math.abs(a.y - b.y) !== 1) continue;
    if (a.x === b.x) {
      const y = Math.min(a.y, b.y);
      ctx.fillRect(a.x * GRID + INSET, y * GRID + GRID / 2, GRID - INSET * 2, GRID);
    } else {
      const x = Math.min(a.x, b.x);
      ctx.fillRect(x * GRID + GRID / 2, a.y * GRID + INSET, GRID, GRID - INSET * 2);
    }
  }
  for (const s of onLayer) {
    ctx.beginPath();
    if (ctx.roundRect) {
      ctx.roundRect(s.x * GRID + INSET, s.y * GRID + INSET, GRID - INSET * 2, GRID - INSET * 2, RADIUS);
    } else {
      ctx.rect(s.x * GRID + INSET, s.y * GRID + INSET, GRID - INSET * 2, GRID - INSET * 2);
    }
    ctx.fill();
  }

  const h = snake[0];
  const cx = h.x * GRID + GRID / 2;
  const cy = h.y * GRID + GRID / 2;
  const fx = cx + dir.x * 7;
  const fy = cy + dir.y * 7;
  const px = -dir.y * 4;
  const py = dir.x * 4;
  ctx.fillStyle = '#fff';
  ctx.fillRect(fx + px - 2, fy + py - 2, 4, 4);
  ctx.fillRect(fx - px - 2, fy - py - 2, 4, 4);
  ctx.fillStyle = '#000';
  ctx.fillRect(fx + px - 1, fy + py - 1, 2, 2);
  ctx.fillRect(fx - px - 1, fy - py - 1, 2, 2);

  for (const f of layers[z].fruits) {
    ctx.fillStyle = FRUIT_STYLES[f.type];
    ctx.fillRect(f.x * GRID, f.y * GRID, GRID, GRID);
  }

  ctx.fillStyle = '#000';
  ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('得分: ' + score + '  第' + z + '层', 10, 20);

  if (controlsReversed()) {
    ctx.fillStyle = '#f80';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'right';
    const secs = Math.ceil((reverseUntil - Date.now()) / 1000);
    ctx.fillText('方向反转 ' + secs + 's', canvas.width - 10, 20);
    ctx.textAlign = 'left';
  }

  const t = Date.now() - layerChangeAt;
  if (started && !paused && !cleared && t < 500) {
    const k = 1 - t / 500;
    ctx.fillStyle = 'rgba(255,255,255,' + (0.45 * k).toFixed(3) + ')';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = 'rgba(0,0,0,' + k.toFixed(3) + ')';
    ctx.font = 'bold 26px sans-serif';
    ctx.textAlign = 'center';
    const bounce = Math.round(-18 * Math.sin((1 - k) * Math.PI));
    ctx.fillText((layerChangeDir > 0 ? '↑ 进入第 ' : '↓ 回到第 ') + z + ' 层', canvas.width / 2, canvas.height / 2 + bounce);
  }

  if (toastMsg) {
    const age = Date.now() - toastMsg.at;
    if (age < 1000) {
      const k = Math.min(1, age / 150, (1000 - age) / 250);
      ctx.globalAlpha = k;
      ctx.fillStyle = '#000';
      ctx.font = 'bold 15px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(toastMsg.text, canvas.width / 2, 44);
      ctx.globalAlpha = 1;
      ctx.textAlign = 'left';
    }
  }

  if (cleared) {
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#000';
    ctx.font = 'bold 28px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('通关!', canvas.width / 2, canvas.height / 2 - 20);
    ctx.font = '16px sans-serif';
    ctx.fillText('得分: ' + score, canvas.width / 2, canvas.height / 2 + 10);
    ctx.fillText('点击开始按钮再来一局', canvas.width / 2, canvas.height / 2 + 40);
  } else if (!started) {
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#000';
    ctx.font = 'bold 24px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('贪吃蛇', canvas.width / 2, canvas.height / 2 - 10);
    ctx.font = '16px sans-serif';
    ctx.fillText('点击开始按钮开始游戏', canvas.width / 2, canvas.height / 2 + 20);
  } else if (paused) {
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#000';
    ctx.font = 'bold 24px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('暂停中', canvas.width / 2, canvas.height / 2);
    ctx.font = '16px sans-serif';
    ctx.fillText('按空格或点击暂停按钮继续', canvas.width / 2, canvas.height / 2 + 30);
  }
}

function reset() {
  snake = [{x: 10, y: 10, z: 1}];
  dir = {x: 1, y: 0};
  nextDir = dir;
  score = 0;
  speedOffset = 0;
  reverseUntil = 0;
  layers = {};
  ensureLayer(1);
  paused = false;
  cleared = false;
  pauseBtn.textContent = '暂停';
}

document.addEventListener('keydown', e => {
  if (e.isComposing) return;

  if (e.code === 'Space') {
    e.preventDefault();
    if (started && !cleared) togglePause();
    return;
  }

  if (!started || cleared) return;

  const keyMap = {
    ArrowUp:    {x: 0, y: -1},
    ArrowDown:  {x: 0, y: 1},
    ArrowLeft:  {x: -1, y: 0},
    ArrowRight: {x: 1, y: 0}
  };
  let d = keyMap[e.code];
  if (!d) return;
  e.preventDefault();
  if (controlsReversed()) d = {x: -d.x, y: -d.y};
  if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d;
});

function tick() {
  step();
  const speed = Math.max(50, Math.min(600, Number(speedInput.value) + speedOffset - score * 5));
  setTimeout(tick, speed);
}
tick();

function frame() {
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
