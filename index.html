<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>贪吃蛇</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #eee;
  }
  canvas {
    background: #fff;
    border: 2px solid #000;
  }
</style>
</head>
<body>
<canvas id="game" width="400" height="400"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const GRID = 20;
const COLS = canvas.width / GRID;
const ROWS = canvas.height / GRID;

let snake = [{x: 10, y: 10}];
let dir = {x: 1, y: 0};
let nextDir = dir;
let food = randomFood();
let over = false;
let paused = false;
let score = 0;

function randomFood() {
  let p;
  do {
    p = {
      x: Math.floor(Math.random() * COLS),
      y: Math.floor(Math.random() * ROWS)
    };
  } while (snake.some(s => s.x === p.x && s.y === p.y));
  return p;
}

function step() {
  if (over || paused) return;
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS ||
      snake.some(s => s.x === head.x && s.y === head.y)) {
    over = true;
    return;
  }

  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    food = randomFood();
  } else {
    snake.pop();
  }
}

function draw() {
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#000';
  for (const s of snake) {
    ctx.fillRect(s.x * GRID, s.y * GRID, GRID, GRID);
  }

  const h = snake[0];
  const cx = h.x * GRID + GRID / 2;
  const cy = h.y * GRID + GRID / 2;
  const fx = cx + dir.x * 7;
  const fy = cy + dir.y * 7;
  const px = -dir.y * 4;
  const py = dir.x * 4;
  ctx.fillStyle = '#fff';
  ctx.fillRect(fx + px - 2, fy + py - 2, 4, 4);
  ctx.fillRect(fx - px - 2, fy - py - 2, 4, 4);
  ctx.fillStyle = '#000';
  ctx.fillRect(fx + px - 1, fy + py - 1, 2, 2);
  ctx.fillRect(fx - px - 1, fy - py - 1, 2, 2);

  ctx.fillStyle = '#f00';
  ctx.fillRect(food.x * GRID, food.y * GRID, GRID, GRID);

  ctx.fillStyle = '#000';
  ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('得分: ' + score, 10, 20);

  if (over) {
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#000';
    ctx.font = 'bold 24px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('游戏结束', canvas.width / 2, canvas.height / 2 - 10);
    ctx.font = '16px sans-serif';
    ctx.fillText('得分: ' + score, canvas.width / 2, canvas.height / 2 + 20);
    ctx.fillText('按回车重新开始', canvas.width / 2, canvas.height / 2 + 45);
  } else if (paused) {
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#000';
    ctx.font = 'bold 24px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('暂停中', canvas.width / 2, canvas.height / 2);
    ctx.font = '16px sans-serif';
    ctx.fillText('按空格继续', canvas.width / 2, canvas.height / 2 + 30);
  }
}

function reset() {
  snake = [{x: 10, y: 10}];
  dir = {x: 1, y: 0};
  nextDir = dir;
  score = 0;
  food = randomFood();
  over = false;
  paused = false;
}

document.addEventListener('keydown', e => {
  if (e.isComposing) return;

  if (e.code === 'Space') {
    e.preventDefault();
    if (!over) paused = !paused;
    return;
  }

  if (over) {
    if (e.code === 'Enter') reset();
    return;
  }

  const keyMap = {
    ArrowUp:    {x: 0, y: -1},
    ArrowDown:  {x: 0, y: 1},
    ArrowLeft:  {x: -1, y: 0},
    ArrowRight: {x: 1, y: 0}
  };
  const d = keyMap[e.code];
  if (!d) return;
  e.preventDefault();
  if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d;
});

function loop() {
  step();
  draw();
  const speed = Math.max(60, 150 - score * 5);
  setTimeout(loop, speed);
}
loop();
</script>
</body>
</html>
