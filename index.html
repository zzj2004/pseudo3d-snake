<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>贪吃蛇</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #4a3f35;
  }
  canvas {
    background: #f7f2e7;
    border: 3px solid #6d4c41;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: #f7f2e7;
  }
  .controls button {
    padding: 4px 14px;
    font-size: 14px;
    border: 1px solid #6d4c41;
    background: #f7f2e7;
    color: #1a1a1a;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="game" width="400" height="400"></canvas>
  <div class="controls">
    <button id="startBtn">开始</button>
    <button id="pauseBtn">暂停</button>
    <button id="restartBtn">重新开始</button>
    <button id="modeBtn">模式:无尽</button>
    <button id="soundBtn">音效:关</button>
    <label for="speed">速度:</label>
    <input type="range" id="speed" min="80" max="300" step="10" value="150">
    <span id="speedLabel">150ms</span>
  </div>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const GRID = 20;
const COLS = canvas.width / GRID;
const ROWS = canvas.height / GRID;

const speedInput = document.getElementById('speed');
const speedLabel = document.getElementById('speedLabel');
speedInput.addEventListener('input', () => {
  speedLabel.textContent = speedInput.value + 'ms';
});

const pauseBtn = document.getElementById('pauseBtn');
const startBtn = document.getElementById('startBtn');
const restartBtn = document.getElementById('restartBtn');
pauseBtn.addEventListener('click', () => {
  if (started && !cleared && !settled) togglePause();
});
startBtn.addEventListener('click', () => {
  if (!started || cleared || settled) {
    reset();
    started = true;
    if (soundOn) ensureAudio();
  }
});
restartBtn.addEventListener('click', () => {
  reset();
  started = true;
  if (soundOn) ensureAudio();
});
const soundBtn = document.getElementById('soundBtn');
soundBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  soundBtn.textContent = soundOn ? '音效:开' : '音效:关';
  save.sound = soundOn;
  persist();
  if (soundOn) {
    ensureAudio();
    playSound('eat', 'normal');
  }
});
function togglePause() {
  paused = !paused;
  pauseBtn.textContent = paused ? '继续' : '暂停';
  if (mode === 'timed') {
    if (paused) timedPauseLeft = timedEndsAt - Date.now();
    else timedEndsAt = Date.now() + timedPauseLeft;
  }
}

const modeBtn = document.getElementById('modeBtn');
const MODE_NAMES = {endless: '无尽', survival: '有命', timed: '限时'};
const MODE_DESC = {
  endless: '无尽模式:经典玩法,永不结束',
  survival: '有命模式:3 条命,小心炸弹果',
  timed: '限时模式:180 秒冲高分'
};
let mode = 'endless';
function applyModeBtn() {
  modeBtn.textContent = '模式:' + MODE_NAMES[mode];
}
applyModeBtn();
modeBtn.addEventListener('click', () => {
  if (started && !cleared && !settled) {
    showToast('本局结束后可切换模式');
    return;
  }
  const order = ['endless', 'survival', 'timed'];
  mode = order[(order.indexOf(mode) + 1) % 3];
  applyModeBtn();
  reset();
});

let started = false;
let paused = false;
let cleared = false;
let settled = false;
let settleReason = '';
let score = 0;
let lives = 3;
let invincibleUntil = 0;
let timedEndsAt = 0;
let timedPauseLeft = 0;
let bestAtStart = 0;
let fastUntil = 0;
let slowUntil = 0;
let doubleUntil = 0;
let ghostUntil = 0;
let reverseUntil = 0;
let layerChangeAt = 0;
let layerChangeDir = 0;
let toastMsg = null;
const hintsShown = {};

function showToast(text) {
  toastMsg = {text: text, at: Date.now()};
}
function showHint(key, text) {
  if (hintsShown[key]) return;
  hintsShown[key] = true;
  showToast(text);
}

const SAVE_KEY = 'snake3d_save';
const FRUIT_DESC = {
  normal: '普通 +1 分', fast: '加速 6 秒', slow: '减速 6 秒', grow: '蛇身 +3',
  shrink: '蛇身 -2', reverse: '方向反转 8 秒', up: '升上一层', down: '降下一层',
  rainbow: '随机一种效果', gold: '+50 分不变长', teleport: '传送到本层空格',
  clock: '重置速度效果', bomb: '炸弹 扣 1 命',
  double: '双倍分 10 秒', ghost: '隐身 5 秒穿身', scissors: '蛇身减半'
};
function defaultSave() {
  return {v: 2, best: {endless: 0, survival: 0, timed: 0}, sound: false, stats: {climbs: 0, descents: 0, fruits: {}}, book: {}};
}
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return defaultSave();
    const s = JSON.parse(raw);
    if (!s || !s.stats) return defaultSave();
    let best;
    if (s.v === 2 && s.best && typeof s.best === 'object') {
      best = {
        endless: Number(s.best.endless) || 0,
        survival: Number(s.best.survival) || 0,
        timed: Number(s.best.timed) || 0
      };
    } else if (s.v === 1) {
      best = {endless: Number(s.best) || 0, survival: 0, timed: 0};
    } else {
      return defaultSave();
    }
    return {
      v: 2,
      best: best,
      sound: !!s.sound,
      stats: {
        climbs: Number(s.stats.climbs) || 0,
        descents: Number(s.stats.descents) || 0,
        fruits: (s.stats.fruits && typeof s.stats.fruits === 'object') ? s.stats.fruits : {}
      },
      book: (s.book && typeof s.book === 'object') ? s.book : {}
    };
  } catch (e) {
    return defaultSave();
  }
}
function persist() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(save));
  } catch (e) {}
}
const save = loadSave();

let soundOn = save.sound;
soundBtn.textContent = soundOn ? '音效:开' : '音效:关';
let audioCtx = null;
const FRUIT_PITCH = {
  normal: 440, fast: 587, slow: 349, grow: 494,
  shrink: 330, reverse: 294, up: 659, down: 262,
  rainbow: 622, gold: 880, teleport: 220, clock: 392, bomb: 110,
  double: 988, ghost: 698, scissors: 175
};

let snake = [
  {x: 10, y: 10, z: 1},
  {x: 9, y: 10, z: 1},
  {x: 8, y: 10, z: 1},
  {x: 7, y: 10, z: 1},
  {x: 6, y: 10, z: 1}
];
let dir = {x: 1, y: 0};
let nextDir = dir;

let demoSnake = [];
let demoDir = {x: 1, y: 0};
function resetDemo() {
  demoSnake = [];
  for (let i = 0; i < 7; i++) demoSnake.push({x: 8 - i, y: 5, z: 1});
  demoDir = {x: 1, y: 0};
}
function demoStep() {
  if (Math.random() < 0.35) {
    const opts = [{x: 0, y: -1}, {x: 0, y: 1}, {x: -1, y: 0}, {x: 1, y: 0}].filter(d => d.x !== -demoDir.x || d.y !== -demoDir.y);
    demoDir = opts[Math.floor(Math.random() * opts.length)];
  }
  const head = {x: demoSnake[0].x + demoDir.x, y: demoSnake[0].y + demoDir.y, z: 1};
  if (head.x < 0) head.x = COLS - 1;
  if (head.x >= COLS) head.x = 0;
  if (head.y < 0) head.y = ROWS - 1;
  if (head.y >= ROWS) head.y = 0;
  demoSnake = [head, ...demoSnake.slice(0, -1)];
}
resetDemo();

const FRUIT_STYLES = {
  normal:  '#f00',
  fast:    '#0a0',
  slow:    '#06c',
  grow:    '#c90',
  shrink:  '#a0c',
  reverse: '#f80',
  up:      '#f0f',
  down:    '#0cc',
  rainbow: '#ff0',
  gold:    '#fd0',
  teleport:'#666',
  clock:   '#fff',
  bomb:    '#a00',
  double:  '#ccc',
  ghost:   'rgba(120,120,120,0.5)',
  scissors:'#860'
};
const BASE_POOL = ['normal','normal','normal','normal','fast','slow','grow','shrink','reverse','rainbow','gold','teleport','clock','double','ghost','scissors'];
const RAINBOW_POOL = ['normal','fast','slow','grow','shrink','reverse','up','down'];

/* ===== 「笔墨纸砚」色板(Zcode 设计稿,只动绘制层) ===== */
const PALETTE = {
  frame: '#6d4c41',
  paper: {
    xuan:    {bg: '#f7f2e7', fiber: '#e8e0cc'},
    bamboo:  {bg: '#eef3ea', fiber: '#dbe5d6'},
    silk:    {bg: '#f2e8dc', fiber: '#e4d6c2'}
  },
  inkDark: '#1a1a1a', inkLight: '#555555',
  inkHalo: 'rgba(26,26,26,0.13)',
  flyWhite: 'rgba(247,242,231,0.6)',
  sealRed: '#b03a2e',
  titleInk: '#1a1a1a', bodyInk: '#3a3a3a', unlit: '#9e9e9e',
  shadow: 'rgba(60,50,30,0.18)'
};
const INK_COLORS = {
  normal: '#b03a2e', fast: '#1e8449', slow: '#2874a6', grow: '#d4ac0d',
  shrink: '#7d3c98', reverse: '#ca6f1e', up: '#c2185b', down: '#148f77',
  gold: '#b7950b', teleport: '#566573', clock: '#e8f0f0',
  bomb: '#ffffff', double: '#b7950b', ghost: 'rgba(80,80,80,0.45)',
  rainbow: '#1a1a1a', scissors: '#7b4a12'
};

function lerpColor(c1, c2, t) {
  const a = parseInt(c1.slice(1), 16);
  const b = parseInt(c2.slice(1), 16);
  const r = Math.round((a >> 16) + ((b >> 16) - (a >> 16)) * t);
  const g = Math.round(((a >> 8) & 255) + (((b >> 8) & 255) - ((a >> 8) & 255)) * t);
  const bl = Math.round((a & 255) + ((b & 255) - (a & 255)) * t);
  return 'rgb(' + r + ',' + g + ',' + bl + ')';
}
function paperFor(z) {
  const r = ((z % 3) + 3) % 3;
  return r === 1 ? 'xuan' : (r === 2 ? 'bamboo' : 'silk');
}
const paperTex = {};
(function buildPaperTextures() {
  for (const key in PALETTE.paper) {
    const c = document.createElement('canvas');
    c.width = canvas.width;
    c.height = canvas.height;
    const t = c.getContext('2d');
    t.strokeStyle = PALETTE.paper[key].fiber;
    t.fillStyle = PALETTE.paper[key].fiber;
    t.lineWidth = 1;
    for (let i = 0; i < 80; i++) {
      const x = Math.random() * c.width;
      const y = Math.random() * c.height;
      const len = 8 + Math.random() * 22;
      const ang = Math.random() * Math.PI * 2;
      const bend = (Math.random() - 0.5) * 12;
      t.globalAlpha = 0.5;
      t.beginPath();
      t.moveTo(x, y);
      t.quadraticCurveTo(x + Math.cos(ang) * len / 2 - Math.sin(ang) * bend, y + Math.sin(ang) * len / 2 + Math.cos(ang) * bend, x + Math.cos(ang) * len, y + Math.sin(ang) * len);
      t.stroke();
    }
    t.fillStyle = '#ece4d0';
    for (let i = 0; i < 40; i++) {
      t.globalAlpha = 0.5;
      t.beginPath();
      t.arc(Math.random() * c.width, Math.random() * c.height, 0.5 + Math.random() * 0.5, 0, Math.PI * 2);
      t.fill();
    }
    t.globalAlpha = 1;
    paperTex[key] = c;
  }
})();

let layers = {};
function ensureLayer(z, avoid) {
  if (!layers[z]) {
    layers[z] = {fruits: [], walls: []};
    for (let i = 0; i < 3; i++) layers[z].fruits.push(randomFruit(z, avoid));
    if (z >= 2) {
      const count = 3 + Math.floor(Math.random() * 4) + Math.min(2, Math.floor((z - 1) / 5));
      for (let i = 0; i < count; i++) layers[z].walls.push(randomWall(z, avoid));
    }
  }
}
function fruitPool(z) {
  const pool = z >= 2 ? BASE_POOL.concat(['up', 'down']) : BASE_POOL.slice();
  if (mode === 'survival') pool.push('bomb');
  const bonus = Math.min(3, Math.floor((z - 1) / 3));
  for (let i = 0; i < bonus; i++) pool.push('gold', 'rainbow');
  return pool;
}
function randomFruit(z, avoid) {
  const pool = fruitPool(z);
  const fruits = layers[z].fruits;
  let p;
  do {
    p = {
      x: Math.floor(Math.random() * COLS),
      y: Math.floor(Math.random() * ROWS)
    };
  } while (snake.some(s => s.z === z && s.x === p.x && s.y === p.y) ||
           fruits.some(f => f.x === p.x && f.y === p.y) ||
           layers[z].walls.some(w => w.x === p.x && w.y === p.y) ||
           (avoid && avoid.x === p.x && avoid.y === p.y));
  p.type = pool[Math.floor(Math.random() * pool.length)];
  return p;
}
function randomWall(z, avoid) {
  let p;
  do {
    p = {
      x: Math.floor(Math.random() * COLS),
      y: Math.floor(Math.random() * ROWS)
    };
  } while (layers[z].walls.some(w => w.x === p.x && w.y === p.y) ||
           layers[z].fruits.some(f => f.x === p.x && f.y === p.y) ||
           snake.some(s => s.z === z && s.x === p.x && s.y === p.y) ||
           (avoid && avoid.x === p.x && avoid.y === p.y));
  return p;
}
ensureLayer(1);

function climbIfColliding(head, body) {
  for (let i = 0; i < 10 && body.some(s => s.z === head.z && s.x === head.x && s.y === head.y); i++) {
    head.z += 1;
    ensureLayer(head.z, head);
  }
}

function step() {
  if (!started || paused || cleared || settled) return;
  if (mode === 'timed' && Date.now() >= timedEndsAt) {
    settle('timeup');
    return;
  }
  dir = nextDir;

  const old = snake.map(s => ({x: s.x, y: s.y, z: s.z}));
  const head = {x: old[0].x + dir.x, y: old[0].y + dir.y, z: old[0].z};
  let wrapped = false;
  if (head.x < 0) { head.x = COLS - 1; wrapped = true; }
  if (head.x >= COLS) { head.x = 0; wrapped = true; }
  if (head.y < 0) { head.y = ROWS - 1; wrapped = true; }
  if (head.y >= ROWS) { head.y = 0; wrapped = true; }
  if (wrapped) showHint('wrap', '穿墙:从对侧出来,不会死');

  const eatsHere = layers[head.z].fruits.some(f => f.x === head.x && f.y === head.y);
  const body = eatsHere ? old : old.slice(0, -1);
  const ghosting = Date.now() < ghostUntil;
  const hitWall = layers[head.z].walls.some(w => w.x === head.x && w.y === head.y);
  if (hitWall) {
    head.z += 1;
    ensureLayer(head.z, head);
  }
  if (!ghosting) climbIfColliding(head, body);
  if (head.z > old[0].z) {
    showHint(hitWall ? 'wall' : 'climb', hitWall ? '撞到墙→爬上一层!' : '撞到自己→爬上一层!');
  }

  const eaten = layers[head.z].fruits.find(f => f.x === head.x && f.y === head.y);
  if (eaten) {
    const eatenZ = head.z;
    const eff = eaten.type === 'rainbow' ? RAINBOW_POOL[Math.floor(Math.random() * RAINBOW_POOL.length)] : eaten.type;
    if (eff === 'up') {
      head.z += 1;
      ensureLayer(head.z, head);
      climbIfColliding(head, old);
    } else if (eff === 'down' && head.z > 1) {
      head.z -= 1;
      climbIfColliding(head, old);
    }
    snake = [head, ...old];
    eat(eaten, eatenZ, eff);
  } else {
    snake = [head, ...old.slice(0, -1)];
  }

  if (snake[0].z !== old[0].z) {
    layerChangeAt = Date.now();
    layerChangeDir = snake[0].z > old[0].z ? 1 : -1;
    playSound(layerChangeDir > 0 ? 'climb' : 'descend');
    if (layerChangeDir > 0) save.stats.climbs++; else save.stats.descents++;
    persist();
  }
}

function eat(f, z, eff) {
  if (eff === undefined) eff = f.type;
  const mult = Date.now() < doubleUntil ? 2 : 1;
  let gain = mult;
  if (f.type === 'gold') gain += 50 * mult;
  const prevScore = score;
  score += gain;
  if (f.type === 'gold') showToast('+' + gain + ' 分!');
  if (Math.floor(score / 100) > Math.floor(prevScore / 100)) showToast(score + ' 分!');
  if (score >= 999999999 && mode === 'endless') {
    cleared = true;
    playSound('clear');
  }
  save.stats.fruits[f.type] = (save.stats.fruits[f.type] || 0) + 1;
  save.book[f.type] = true;
  if (score > save.best[mode]) save.best[mode] = score;
  persist();
  layers[z].fruits = layers[z].fruits.filter(x => x !== f);
  layers[z].fruits.push(randomFruit(z));

  const grow = {normal: 0, fast: 0, slow: 0, grow: 2, shrink: -3, reverse: 0, up: 0, down: 0, rainbow: 0, gold: 0, teleport: 0, clock: 0, bomb: 0, double: 0, ghost: 0, scissors: 0}[eff];
  if (grow > 0) {
    const tail = snake[snake.length - 1];
    for (let i = 0; i < grow; i++) snake.push({x: tail.x, y: tail.y, z: tail.z});
  } else {
    for (let i = 0; i < -grow && snake.length > 2; i++) snake.pop();
  }
  if (f.type === 'scissors') {
    const target = Math.max(2, Math.floor(snake.length / 2));
    while (snake.length > target) snake.pop();
    showHint('scissors', '蛇身减半!');
  }

  if (f.type === 'double') { doubleUntil = Date.now() + 10000; showHint('double', '双倍分 10 秒!'); }
  if (f.type === 'ghost') { ghostUntil = Date.now() + 5000; showHint('ghost', '隐身 5 秒,穿身不爬层!'); }
  if (eff === 'fast') { fastUntil = Date.now() + 6000; slowUntil = 0; showHint('fast', '加速 6 秒!'); }
  if (eff === 'slow') { slowUntil = Date.now() + 6000; fastUntil = 0; showHint('slow', '减速 6 秒!'); }
  if (eff === 'clock') { fastUntil = 0; slowUntil = 0; showHint('clock', '速度效果已重置!'); }
  if (eff === 'grow') showHint('grow', '蛇身 +3');
  if (eff === 'shrink') showHint('shrink', '蛇身 -2');
  if (eff === 'reverse') { reverseUntil = Date.now() + 8000; showHint('reverse', '方向反转 8 秒!'); }
  if (f.type === 'teleport') {
    const z2 = snake[0].z;
    let p;
    do {
      p = {x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS)};
    } while (
      snake.some(s => s.z === z2 && s.x === p.x && s.y === p.y) ||
      layers[z2].fruits.some(q => q.x === p.x && q.y === p.y) ||
      layers[z2].walls.some(w => w.x === p.x && w.y === p.y)
    );
    snake[0].x = p.x;
    snake[0].y = p.y;
    showToast('传送!');
    playSound('teleport');
  } else if (f.type === 'bomb') {
    if (Date.now() < invincibleUntil) {
      showToast('无敌中,炸弹无效!');
    } else {
      lives--;
      if (lives <= 0) {
        settle('dead');
      } else {
        invincibleUntil = Date.now() + 2000;
        showToast('扣 1 命!剩 ' + lives + ' 命');
      }
    }
    playSound('bomb');
  } else if (f.type === 'reverse') playSound('reverse');
  else if (f.type !== 'up' && f.type !== 'down') playSound('eat', f.type);
}

function settle(reason) {
  settled = true;
  settleReason = reason;
  playSound('settle');
  persist();
}

function controlsReversed() {
  return Date.now() < reverseUntil;
}

function fillFruitShape(type, px, py, size) {
  const cxp = px + size / 2;
  const cyp = py + size / 2;
  const showExtras = ctx.globalAlpha >= 0.99 && size >= 20;
  let pool = INK_COLORS[type];
  if (type === 'rainbow') {
    const v = (Math.sin(Date.now() / 600) + 1) / 2;
    pool = lerpColor('#1a1a1a', '#888888', v);
  }
  const body = type === 'bomb' ? '#8e2b25' : '#3e4450';
  if (showExtras) {
    ctx.save();
    ctx.shadowColor = PALETTE.shadow;
    ctx.shadowOffsetX = 2;
    ctx.shadowOffsetY = 2;
    ctx.shadowBlur = 2;
  }
  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.ellipse(cxp, cyp, 0.4 * size, 0.325 * size, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#262b33';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.fillStyle = pool;
  ctx.beginPath();
  ctx.ellipse(cxp, cyp + 0.02 * size, 0.25 * size, 0.2 * size, 0, 0, Math.PI * 2);
  ctx.fill();
  if (showExtras) {
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = Math.max(1, size / 14);
    ctx.beginPath();
    ctx.ellipse(cxp, cyp + 0.02 * size, 0.25 * size, 0.2 * size, -0.6, -2.4, -0.9);
    ctx.stroke();
  }
  if (type === 'bomb') {
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(cxp, cyp, 0.4 * size + 1.5, 0.325 * size + 1.5, 0, 0, Math.PI * 2);
    ctx.stroke();
  } else if (type === 'double') {
    ctx.strokeStyle = 'rgba(246,190,0,' + (0.4 + 0.6 * Math.abs(Math.sin(Date.now() / 200))).toFixed(3) + ')';
    ctx.lineWidth = Math.max(1.2, size / 16);
    ctx.beginPath();
    ctx.ellipse(cxp, cyp, 0.4 * size + 1, 0.325 * size + 1, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
}

function drawWall(x, y) {
  const px = x * GRID;
  const py = y * GRID;
  const s = 16;
  const rx = px + (GRID - s) / 2;
  const ry = py + (GRID - s) / 2;
  ctx.save();
  ctx.shadowColor = PALETTE.shadow;
  ctx.shadowOffsetX = 2;
  ctx.shadowOffsetY = 2;
  ctx.shadowBlur = 2;
  ctx.fillStyle = '#2f3640';
  ctx.strokeStyle = '#1b2126';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(rx, ry, s, s, 3);
  else ctx.rect(rx, ry, s, s);
  ctx.fill();
  ctx.stroke();
  ctx.restore();
  ctx.strokeStyle = '#454e5c';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(rx + 3.5, ry + s - 3.5);
  ctx.lineTo(rx + s - 3.5, ry + 3.5);
  ctx.moveTo(rx + 3.5, ry + 3.5);
  ctx.lineTo(rx + s - 3.5, ry + s - 3.5);
  ctx.stroke();
}

function ensureAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  if (!audioCtx) audioCtx = new AC();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freq, delay, dur, type, vol, slideTo) {
  const t0 = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  gain.gain.setValueAtTime(vol, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + dur + 0.05);
}
function playSound(name, type) {
  if (!soundOn || !audioCtx) return;
  if (name === 'eat') {
    tone(FRUIT_PITCH[type] || 440, 0, 0.09, 'triangle', 0.12);
  } else if (name === 'climb') {
    tone(330, 0, 0.15, 'sine', 0.12, 660);
  } else if (name === 'descend') {
    tone(660, 0, 0.15, 'sine', 0.12, 330);
  } else if (name === 'reverse') {
    tone(420, 0, 0.09, 'square', 0.07);
    tone(310, 0.11, 0.13, 'square', 0.07);
  } else if (name === 'teleport') {
    tone(180, 0, 0.2, 'sine', 0.12, 720);
  } else if (name === 'bomb') {
    tone(150, 0, 0.22, 'square', 0.1, 55);
  } else if (name === 'settle') {
    tone(659, 0, 0.16, 'triangle', 0.12);
    tone(523, 0.15, 0.16, 'triangle', 0.12);
    tone(392, 0.3, 0.3, 'triangle', 0.12);
  } else if (name === 'clear') {
    tone(523, 0, 0.14, 'triangle', 0.12);
    tone(659, 0.13, 0.14, 'triangle', 0.12);
    tone(784, 0.26, 0.14, 'triangle', 0.12);
    tone(1047, 0.39, 0.32, 'triangle', 0.12);
  }
}

function drawBrushHead(h, d) {
  const cx = h.x * GRID + GRID / 2;
  const cy = h.y * GRID + GRID / 2;
  const px = -d.y;
  const py = d.x;
  ctx.save();
  ctx.shadowColor = PALETTE.shadow;
  ctx.shadowOffsetX = 2;
  ctx.shadowOffsetY = 2;
  ctx.shadowBlur = 2;
  ctx.fillStyle = PALETTE.inkDark;
  ctx.beginPath();
  ctx.moveTo(cx + d.x * 11, cy + d.y * 11);
  ctx.lineTo(cx + px * 5, cy + py * 5);
  ctx.lineTo(cx - px * 5, cy - py * 5);
  ctx.closePath();
  ctx.fill();
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#8d6e63';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(cx - d.x * 6, cy - d.y * 6);
  ctx.stroke();
  ctx.strokeStyle = '#a1887f';
  ctx.beginPath();
  ctx.moveTo(cx - d.x * 6, cy - d.y * 6);
  ctx.lineTo(cx - d.x * 10, cy - d.y * 10);
  ctx.stroke();
  ctx.strokeStyle = '#c9a227';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx - d.x * 9, cy - d.y * 9);
  ctx.lineTo(cx - d.x * 10, cy - d.y * 10);
  ctx.stroke();
  ctx.restore();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(cx + d.x * 2 + px * 3, cy + d.y * 2 + py * 3, 1.8, 0, Math.PI * 2);
  ctx.arc(cx + d.x * 2 - px * 3, cy + d.y * 2 - py * 3, 1.8, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = PALETTE.sealRed;
  ctx.lineWidth = 1.6;
  ctx.lineCap = 'butt';
  const tx = cx + d.x * 16;
  const ty = cy + d.y * 16;
  ctx.beginPath();
  ctx.moveTo(cx + d.x * 11, cy + d.y * 11);
  ctx.lineTo(tx, ty);
  ctx.moveTo(tx, ty);
  ctx.lineTo(tx + d.x * 2 - d.y * 2, ty + d.y * 2 + d.x * 2);
  ctx.moveTo(tx, ty);
  ctx.lineTo(tx + d.x * 2 + d.y * 2, ty + d.y * 2 - d.x * 2);
  ctx.stroke();
}

function drawInkSnake(cells, headW, tailW, headDir) {
  const n = cells.length;
  if (n === 0) return;
  const pts = cells.map(s => ({x: s.x * GRID + GRID / 2, y: s.y * GRID + GRID / 2}));
  const near = (i) => Math.abs(cells[i - 1].x - cells[i].x) + Math.abs(cells[i - 1].y - cells[i].y) === 1;
  const w = (i) => headW - (headW - tailW) * (i / n);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = PALETTE.inkHalo;
  for (let i = 1; i < n; i++) {
    if (!near(i)) continue;
    ctx.lineWidth = w(i) + 4;
    ctx.beginPath();
    ctx.moveTo(pts[i - 1].x, pts[i - 1].y);
    ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();
  }
  for (let i = 1; i < n; i++) {
    if (!near(i)) continue;
    ctx.strokeStyle = lerpColor(PALETTE.inkDark, PALETTE.inkLight, i / n);
    ctx.lineWidth = w(i);
    ctx.beginPath();
    ctx.moveTo(pts[i - 1].x, pts[i - 1].y);
    ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();
  }
  ctx.strokeStyle = PALETTE.flyWhite;
  ctx.lineWidth = 1;
  for (let i = Math.max(1, Math.floor(n * 0.7)); i < n; i++) {
    if (!near(i)) continue;
    const a = pts[i - 1];
    const b = pts[i];
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const len = Math.hypot(dx, dy);
    const ux = dx / len;
    const uy = dy / len;
    const midx = (a.x + b.x) / 2;
    const midy = (a.y + b.y) / 2;
    const half = len * 0.3;
    for (let k = 0; k < 2; k++) {
      const off = (k === 0 ? 1 : -1) * (1.2 + Math.random() * 1.2);
      ctx.beginPath();
      ctx.moveTo(midx - ux * half - uy * off, midy - uy * half + ux * off);
      ctx.lineTo(midx + ux * half - uy * off, midy + uy * half + ux * off);
      ctx.stroke();
    }
  }
  if (headDir) drawBrushHead(cells[0], headDir);
}

function sealSize(label, text) {
  ctx.save();
  ctx.font = 'bold 9px sans-serif';
  const lw = ctx.measureText(label).width;
  ctx.font = 'bold 14px sans-serif';
  const tw = ctx.measureText(text).width;
  ctx.restore();
  return Math.max(lw, tw) + 14;
}
function drawSeal(x, y, label, text) {
  const w = sealSize(label, text);
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(-3 * Math.PI / 180);
  ctx.fillStyle = PALETTE.sealRed;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(0, 0, w, 24, 3);
  else ctx.rect(0, 0, w, 24);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.font = 'bold 9px sans-serif';
  ctx.fillText(label, w / 2, 9);
  ctx.font = 'bold 14px sans-serif';
  ctx.fillText(text, w / 2, 21);
  ctx.restore();
  return w;
}
function overlayBase() {
  ctx.fillStyle = 'rgba(247,242,231,0.88)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}
function cardRect(x, y, w, h) {
  ctx.save();
  ctx.shadowColor = PALETTE.shadow;
  ctx.shadowOffsetX = 2;
  ctx.shadowOffsetY = 2;
  ctx.shadowBlur = 2;
  ctx.fillStyle = '#fbf7ee';
  ctx.strokeStyle = '#c9bfa8';
  ctx.lineWidth = 1;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, 10);
  else ctx.rect(x, y, w, h);
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}
function bigStamp(cx, cy, text) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(-8 * Math.PI / 180);
  const s = 56;
  ctx.fillStyle = PALETTE.sealRed;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(-s / 2, -s / 2, s, s, 6);
  else ctx.rect(-s / 2, -s / 2, s, s);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 24px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 0, 1);
  ctx.restore();
  ctx.textBaseline = 'alphabetic';
}

function draw() {
  const z = snake[0].z;
  const paper = PALETTE.paper[paperFor(z)];
  ctx.fillStyle = paper.bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(paperTex[paperFor(z)], 0, 0);

  ctx.globalAlpha = 0.15;
  for (const dz of [z - 1, z + 1]) {
    if (!layers[dz]) continue;
    for (const f of layers[dz].fruits) {
      fillFruitShape(f.type, f.x * GRID, f.y * GRID, GRID);
    }
  }
  ctx.globalAlpha = 1;

  for (const w of layers[z].walls) {
    drawWall(w.x, w.y);
  }

  const onLayer = snake.filter(s => s.z === z);

  const blink = Date.now() < invincibleUntil && Math.floor(Date.now() / 120) % 2 === 0;
  const ghosting = Date.now() < ghostUntil;
  ctx.globalAlpha = blink ? 0.25 : (ghosting ? 0.45 : 1);
  drawInkSnake(onLayer, 13, 5, dir);
  ctx.globalAlpha = 1;

  for (const f of layers[z].fruits) {
    fillFruitShape(f.type, f.x * GRID, f.y * GRID, GRID);
  }

  const wScore = drawSeal(10, 8, '得分', '' + score);
  drawSeal(10 + wScore + 6, 8, '层', '' + z);

  if (mode === 'timed' && started && !settled) {
    const left = Math.max(0, timedEndsAt - Date.now());
    const mm = Math.floor(left / 60000);
    const ss = Math.floor(left % 60000 / 1000);
    const text = mm + ':' + (ss < 10 ? '0' : '') + ss;
    const w = sealSize('剩余', text);
    const flashing = left <= 10000 && Math.floor(Date.now() / 400) % 2 === 0;
    ctx.globalAlpha = flashing ? 0.4 : 1;
    drawSeal(canvas.width - 10 - w, 8, '剩余', text);
    ctx.globalAlpha = 1;
  }
  if (mode === 'survival' && started && !settled) {
    ctx.fillStyle = Date.now() < invincibleUntil ? PALETTE.sealRed : PALETTE.inkDark;
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('命 ×' + lives, canvas.width / 2, 20);
    ctx.textAlign = 'left';
  }

  const now = Date.now();
  let buffY = 40;
  function buffLine(color, text) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(14, buffY - 4, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(text, 22, buffY);
    buffY += 18;
  }
  if (now < fastUntil) buffLine(INK_COLORS.fast, '加速 ' + Math.ceil((fastUntil - now) / 1000) + 's');
  else if (now < slowUntil) buffLine(INK_COLORS.slow, '减速 ' + Math.ceil((slowUntil - now) / 1000) + 's');
  if (now < doubleUntil) buffLine(INK_COLORS.double, '双倍分 ' + Math.ceil((doubleUntil - now) / 1000) + 's');
  if (now < ghostUntil) buffLine(INK_COLORS.teleport, '隐身 ' + Math.ceil((ghostUntil - now) / 1000) + 's');

  if (controlsReversed()) {
    ctx.fillStyle = INK_COLORS.reverse;
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'right';
    const secs = Math.ceil((reverseUntil - Date.now()) / 1000);
    ctx.fillText('方向反转 ' + secs + 's', canvas.width - 10, 46);
    ctx.textAlign = 'left';
  }

  const t = Date.now() - layerChangeAt;
  if (started && !paused && !cleared && !settled && t < 500) {
    const k = 1 - t / 500;
    ctx.globalAlpha = 0.5 * k;
    ctx.fillStyle = paper.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(26,26,26,' + k.toFixed(3) + ')';
    ctx.font = 'bold 26px sans-serif';
    ctx.textAlign = 'center';
    const bounce = Math.round(-18 * Math.sin((1 - k) * Math.PI));
    ctx.fillText((layerChangeDir > 0 ? '↑ 翻页 · 第 ' : '↓ 回页 · 第 ') + z + ' 层', canvas.width / 2, canvas.height / 2 + bounce);
  }

  if (toastMsg) {
    const age = Date.now() - toastMsg.at;
    if (age < 1000) {
      const k = Math.min(1, age / 150, (1000 - age) / 250);
      ctx.globalAlpha = k;
      ctx.font = 'bold 15px sans-serif';
      const tw = ctx.measureText(toastMsg.text).width;
      const bw = tw + 20;
      const bh = 26;
      const bx = (canvas.width - bw) / 2;
      const by = 30;
      ctx.fillStyle = 'rgba(38,40,40,0.78)';
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(bx, by, bw, bh, bh / 2);
      else ctx.rect(bx, by, bw, bh);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.fillText(toastMsg.text, canvas.width / 2, by + 17);
      ctx.globalAlpha = 1;
      ctx.textAlign = 'left';
    }
  }

  if (settled) {
    overlayBase();
    cardRect(70, 112, 260, 172);
    ctx.fillStyle = PALETTE.titleInk;
    ctx.font = 'bold 22px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(settleReason === 'dead' ? '命用完了!' : '时间到!', canvas.width / 2, 158);
    ctx.fillStyle = PALETTE.bodyInk;
    ctx.font = '14px sans-serif';
    ctx.fillText(MODE_NAMES[mode] + '模式  得分: ' + score, canvas.width / 2, 186);
    ctx.fillText(score > bestAtStart ? '新纪录!  得分 ' + score : '最高分: ' + save.best[mode], canvas.width / 2, 210);
    ctx.fillText('点击开始按钮再来一局', canvas.width / 2, 238);
    bigStamp(326, 142, score > bestAtStart ? '新纪录' : '结算');
  } else if (cleared) {
    overlayBase();
    cardRect(80, 118, 240, 160);
    ctx.fillStyle = PALETTE.titleInk;
    ctx.font = 'bold 22px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('通关!', canvas.width / 2, 160);
    ctx.fillStyle = PALETTE.bodyInk;
    ctx.font = '14px sans-serif';
    ctx.fillText('得分: ' + score, canvas.width / 2, 188);
    ctx.fillText('最高分: ' + save.best.endless, canvas.width / 2, 212);
    ctx.fillText('点击开始按钮再来一局', canvas.width / 2, 238);
    bigStamp(314, 138, '通关');
  } else if (!started) {
    overlayBase();
    ctx.globalAlpha = 0.3;
    drawInkSnake(demoSnake, 8, 4, demoDir);
    ctx.globalAlpha = 1;
    cardRect(60, 128, 280, 152);
    ctx.fillStyle = PALETTE.titleInk;
    ctx.font = 'bold 22px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('贪吃蛇', canvas.width / 2, 170);
    ctx.fillStyle = PALETTE.bodyInk;
    ctx.font = '14px sans-serif';
    ctx.fillText(MODE_DESC[mode], canvas.width / 2, 198);
    ctx.fillText('最高分: ' + save.best[mode], canvas.width / 2, 222);
    ctx.fillText('点击开始按钮开始游戏', canvas.width / 2, 246);
    ctx.fillStyle = PALETTE.unlit;
    ctx.font = '10px sans-serif';
    ctx.fillText('笔墨纸砚 · 伪三层', canvas.width / 2, 266);
  } else if (paused) {
    overlayBase();
    cardRect(18, 28, 364, 340);
    ctx.fillStyle = PALETTE.titleInk;
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('暂停中', canvas.width / 2, 58);
    ctx.fillStyle = PALETTE.bodyInk;
    ctx.font = '13px sans-serif';
    ctx.fillText('按空格或点击暂停按钮继续', canvas.width / 2, 78);
    ctx.fillText(MODE_NAMES[mode] + '模式最高分: ' + save.best[mode] + '   爬层: 升 ' + save.stats.climbs + ' / 降 ' + save.stats.descents, canvas.width / 2, 98);
    ctx.font = 'bold 15px sans-serif';
    ctx.fillText('果子图鉴(吃过点亮)', canvas.width / 2, 122);
    ctx.font = '13px sans-serif';
    const types = Object.keys(FRUIT_STYLES);
    const perCol = Math.ceil(types.length / 2);
    for (let i = 0; i < types.length; i++) {
      const tt = types[i];
      const x = 32 + Math.floor(i / perCol) * 180;
      const y = 142 + (i % perCol) * 25;
      ctx.globalAlpha = save.book[tt] ? 1 : 0.35;
      fillFruitShape(tt, x, y - 10, 14);
      ctx.globalAlpha = 1;
      ctx.fillStyle = save.book[tt] ? PALETTE.bodyInk : PALETTE.unlit;
      const count = save.stats.fruits[tt] || 0;
      ctx.textAlign = 'left';
      ctx.fillText(save.book[tt] ? FRUIT_DESC[tt] + ' ×' + count : '未尝出…', x + 20, y);
    }
    ctx.textAlign = 'left';
  }
}

function reset() {
  snake = [
    {x: 10, y: 10, z: 1},
    {x: 9, y: 10, z: 1},
    {x: 8, y: 10, z: 1},
    {x: 7, y: 10, z: 1},
    {x: 6, y: 10, z: 1}
  ];
  dir = {x: 1, y: 0};
  nextDir = dir;
  score = 0;
  lives = 3;
  invincibleUntil = 0;
  settled = false;
  settleReason = '';
  bestAtStart = save.best[mode] || 0;
  timedEndsAt = mode === 'timed' ? Date.now() + 180000 : 0;
  timedPauseLeft = 0;
  fastUntil = 0;
  slowUntil = 0;
  doubleUntil = 0;
  ghostUntil = 0;
  reverseUntil = 0;
  layers = {};
  ensureLayer(1);
  paused = false;
  cleared = false;
  pauseBtn.textContent = '暂停';
}

document.addEventListener('keydown', e => {
  if (e.isComposing) return;

  if (e.code === 'Space') {
    e.preventDefault();
    if (started && !cleared && !settled) togglePause();
    return;
  }

  if (!started || cleared || settled) return;

  const keyMap = {
    ArrowUp:    {x: 0, y: -1},
    ArrowDown:  {x: 0, y: 1},
    ArrowLeft:  {x: -1, y: 0},
    ArrowRight: {x: 1, y: 0}
  };
  let d = keyMap[e.code];
  if (!d) return;
  e.preventDefault();
  if (controlsReversed()) d = {x: -d.x, y: -d.y};
  if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d;
});

function tick() {
  if (!started) demoStep();
  step();
  let speed = Number(speedInput.value) - Math.min(100, score * 5);
  if (Date.now() < fastUntil) speed -= 60;
  if (Date.now() < slowUntil) speed += 60;
  speed = Math.max(50, Math.min(600, speed));
  setTimeout(tick, speed);
}
tick();

function frame() {
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
